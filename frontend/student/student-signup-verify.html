<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Fitness Performance Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5, 15, 25, 0.80),
                    rgba(5, 15, 25, 0.90)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center center / cover no-repeat;
        }


        /* ==============================
           OTP CARD
        ============================== */

        .otp-card {
            width: 100%;
            max-width: 470px;

            background: #ffffff;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }


        /* ==============================
           ICON
        ============================== */

        .otp-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #ecfdf3;

            border: 2px solid #22c55e;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
        }


        /* ==============================
           HEADING
        ============================== */

        h1 {
            font-size: 30px;

            color: #111;

            margin-bottom: 10px;
        }

        h1 span {
            color: #22c55e;
        }

        .description {
            color: #666;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* ==============================
           EMAIL DISPLAY
        ============================== */

        .email-display {
            background: #f5f5f5;

            border-radius: 8px;

            padding: 11px;

            margin-bottom: 22px;

            font-size: 13px;

            color: #555;
        }

        .email-display strong {
            color: #222;
        }


        /* ==============================
           OTP INPUTS
        ============================== */

        .otp-container {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 22px;
        }

        .otp-input {
            width: 48px;
            height: 55px;

            border: 1px solid #d5d5d5;

            border-radius: 8px;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            outline: none;

            transition: 0.2s;
        }

        .otp-input:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.12);
        }


        /* ==============================
           VERIFY BUTTON
        ============================== */

        .verify-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #22c55e;

            color: white;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .verify-button:hover {
            background: #16a34a;

            transform: translateY(-1px);
        }

        .verify-button:disabled {
            background: #9ca3af;

            cursor: not-allowed;

            transform: none;
        }


        /* ==============================
           TIMER
        ============================== */

        .timer {
            margin-top: 18px;

            color: #777;

            font-size: 13px;
        }

        .timer span {
            color: #16a34a;

            font-weight: bold;
        }


        /* ==============================
           RESEND
        ============================== */

        .resend {
            margin-top: 15px;

            font-size: 13px;

            color: #777;
        }

        .resend button {
            border: none;

            background: none;

            color: #16a34a;

            font-size: 13px;

            font-weight: bold;

            cursor: pointer;
        }

        .resend button:disabled {
            color: #999;

            cursor: not-allowed;
        }

        .resend button:hover:not(:disabled) {
            text-decoration: underline;
        }


        /* ==============================
           CHANGE EMAIL
        ============================== */

        .change-email {
            display: inline-block;

            margin-top: 22px;

            color: #555;

            font-size: 13px;

            text-decoration: none;
        }

        .change-email:hover {
            color: #22c55e;
        }


        /* ==============================
           MESSAGE
        ============================== */

        .message {
            display: none;

            margin-top: 18px;

            padding: 11px;

            border-radius: 7px;

            font-size: 13px;

            line-height: 1.4;
        }

        .success {
            display: block;

            background: #ecfdf3;

            color: #15803d;

            border: 1px solid #bbf7d0;
        }

        .error {
            display: block;

            background: #fff1f2;

            color: #be123c;

            border: 1px solid #fecdd3;
        }


        /* ==============================
           SECURITY NOTE
        ============================== */

        .security-note {
            border-top: 1px solid #eeeeee;

            margin-top: 25px;

            padding-top: 18px;

            color: #888;

            font-size: 11px;

            line-height: 1.5;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .otp-card {
                padding: 30px 20px;

                border-radius: 15px;
            }

            h1 {
                font-size: 26px;
            }

            .otp-container {
                gap: 6px;
            }

            .otp-input {
                width: 42px;
                height: 50px;

                font-size: 20px;
            }
        }

    </style>

</head>


<body>

    <!-- ==============================
         OTP CARD
    ============================== -->

    <div class="otp-card">


        <!-- ICON -->

        <div class="otp-icon">
            🔐
        </div>


        <!-- HEADING -->

        <h1>
            Verify <span>OTP</span>
        </h1>


        <p class="description">
            Enter the 6-digit verification code
            sent to your email address to complete
            your account registration.
        </p>


        <!-- EMAIL -->

        <div class="email-display">

            OTP sent to:

            <strong id="userEmail">
                student@example.com
            </strong>

        </div>


        <!-- OTP INPUTS -->

        <div class="otp-container">

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
                autofocus
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

        </div>


        <!-- VERIFY BUTTON -->

        <button
            type="button"
            class="verify-button"
            id="verifyButton"
        >
            Verify OTP
        </button>


        <!-- TIMER -->

        <div class="timer">

            OTP expires in:

            <span id="timer">
                02:00
            </span>

        </div>


        <!-- RESEND -->

        <div class="resend">

            Didn't receive the code?

            <button
                type="button"
                id="resendButton"
                disabled
            >
                Resend OTP
            </button>

        </div>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- CHANGE EMAIL -->

        <a
            href="student-signup.html"
            class="change-email"
        >
            ← Change Email Address
        </a>


        <!-- SECURITY -->

        <div class="security-note">

            🔒 Never share your OTP with anyone.
            Our team will never ask you for your OTP.

        </div>

    </div>


    <script>

        /* ==============================
           VARIABLES
        ============================== */

        const otpInputs =
            document.querySelectorAll(".otp-input");

        const verifyButton =
            document.getElementById("verifyButton");

        const resendButton =
            document.getElementById("resendButton");

        const message =
            document.getElementById("message");

        const timerElement =
            document.getElementById("timer");


        /* ==============================
           GET EMAIL FROM SIGNUP PAGE
        ============================== */

        const email =
            sessionStorage.getItem("signupEmail");


        if (email) {

            document.getElementById("userEmail")
                .textContent = maskEmail(email);

        }


        /* ==============================
           MASK EMAIL
        ============================== */

        function maskEmail(email) {

            const parts =
                email.split("@");

            if (parts.length !== 2) {

                return email;

            }

            const username =
                parts[0];

            const domain =
                parts[1];


            if (username.length <= 2) {

                return "*".repeat(username.length)
                    + "@"
                    + domain;

            }


            return username.charAt(0)
                + "*".repeat(username.length - 2)
                + username.charAt(username.length - 1)
                + "@"
                + domain;

        }


        /* ==============================
           OTP INPUT BEHAVIOR
        ============================== */

        otpInputs.forEach(
            (input, index) => {

                input.addEventListener(
                    "input",
                    function() {

                        this.value =
                            this.value
                                .replace(/\D/g, "")
                                .slice(0, 1);


                        if (
                            this.value &&
                            index <
                            otpInputs.length - 1
                        ) {

                            otpInputs[
                                index + 1
                            ].focus();

                        }

                    }
                );


                input.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key === "Backspace" &&
                            !this.value &&
                            index > 0
                        ) {

                            otpInputs[
                                index - 1
                            ].focus();

                        }

                    }
                );


                input.addEventListener(
                    "paste",
                    function(event) {

                        event.preventDefault();

                        const pastedData =
                            event.clipboardData
                                .getData("text")
                                .replace(/\D/g, "")
                                .slice(0, 6);


                        pastedData
                            .split("")
                            .forEach(
                                (digit, i) => {

                                    if (
                                        otpInputs[i]
                                    ) {

                                        otpInputs[i]
                                            .value =
                                            digit;

                                    }

                                }
                            );


                        if (
                            pastedData.length === 6
                        ) {

                            otpInputs[5].focus();

                        }

                    }
                );

            }
        );


        /* ==============================
           GET OTP
        ============================== */

        function getOTP() {

            let otp = "";

            otpInputs.forEach(
                input => {

                    otp += input.value;

                }
            );

            return otp;

        }


        /* ==============================
           SHOW MESSAGE
        ============================== */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        /* ==============================
           VERIFY OTP
        ============================== */

        verifyButton.addEventListener(
            "click",
            function() {

                const otp =
                    getOTP();


                if (otp.length !== 6) {

                    showMessage(
                        "Please enter the complete 6-digit OTP.",
                        "error"
                    );

                    return;

                }


                verifyButton.disabled =
                    true;

                verifyButton.textContent =
                    "Verifying...";


                /*
                 * DEMO OTP VERIFICATION
                 *
                 * Replace this with your
                 * backend verification later.
                 */

                setTimeout(
                    function() {

                        verifyButton.disabled =
                            false;

                        verifyButton.textContent =
                            "Verify OTP";


                        showMessage(
                            "OTP verified successfully. Your account has been created!",
                            "success"
                        );


                        /*
                         * Clear signup email
                         * after successful verification.
                         */

                        sessionStorage.removeItem(
                            "signupEmail"
                        );


                        /*
                         * Redirect to
                         * student dashboard.
                         */

                        setTimeout(
                            function() {

                                window.location.href =
                                    "student-dashboard.html";

                            },
                            1000
                        );

                    },
                    1000
                );

            }
        );


        /* ==============================
           COUNTDOWN TIMER
        ============================== */

        let timeLeft = 120;


        let countdown;

        function startCountdown() {
            clearInterval(countdown);
            countdown = setInterval(
                function() {

                    const minutes =
                        Math.floor(
                            timeLeft / 60
                        );

                    const seconds =
                        timeLeft % 60;


                    timerElement.textContent =
                        String(minutes)
                            .padStart(2, "0")
                        + ":"
                        +
                        String(seconds)
                            .padStart(2, "0");


                    if (timeLeft <= 0) {

                        clearInterval(
                            countdown
                        );


                        timerElement.textContent =
                            "Expired";


                        resendButton.disabled =
                            false;

                    }


                    timeLeft--;

                },
                1000
            );
        }

        startCountdown();


        /* ==============================
           RESEND OTP
        ============================== */

        resendButton.addEventListener(
            "click",
            async function() {

                resendButton.disabled =
                    true;

                resendButton.textContent =
                    "Sending...";


                const email = sessionStorage.getItem("signupEmail");
                if (!email) {
                    showMessage("Signup session expired. Please register again.", "error");
                    resendButton.disabled = false;
                    resendButton.textContent = "Resend OTP";
                    return;
                }

                try {
                    const response = await fetch("/api/account-verification/send", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email: email })
                    });
                    const result = await response.json();
                    if (!response.ok || result.success !== true) {
                        throw new Error(result.message || "Unable to resend OTP.");
                    }
                    timeLeft = 120;
                    timerElement.textContent = "02:00";
                    startCountdown();
                    showMessage("A new OTP has been sent to your email.", "success");
                } catch (error) {
                    showMessage(error.message, "error");
                    resendButton.disabled = false;
                } finally {
                    resendButton.textContent = "Resend OTP";
                }

            }
        );

    
        const realVerifyButton = verifyButton.cloneNode(true);
        verifyButton.replaceWith(realVerifyButton);
        realVerifyButton.addEventListener("click", async function () {
            const otp = getOTP();
            const email = sessionStorage.getItem("signupEmail");
            if (!email || otp.length !== 6) {
                showMessage("Enter the 6-digit OTP sent to your email.", "error");
                return;
            }
            realVerifyButton.disabled = true;
            realVerifyButton.textContent = "Verifying...";
            try {
                const response = await fetch("/api/account-verification/verify", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, otp: otp })
                });
                const result = await response.json();
                if (!response.ok || result.success !== true) {
                    throw new Error(result.message || "OTP verification failed.");
                }
                sessionStorage.removeItem("signupEmail");
                showMessage("Account verified successfully.", "success");
                window.location.href = "student-dashboard.html";
            } catch (error) {
                showMessage(error.message, "error");
                realVerifyButton.disabled = false;
                realVerifyButton.textContent = "Verify OTP";
            }
        });</script>

</body>

</html>
