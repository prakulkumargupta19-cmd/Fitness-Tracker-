<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Fitness Performance Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            background: linear-gradient(rgba(5,15,25,0.80), rgba(5,15,25,0.90)),
                        url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                        center center / cover no-repeat;
        }
        .otp-card {
            width: 100%; max-width: 470px;
            background: #ffffff; border-radius: 20px;
            padding: 40px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
        }
        .otp-icon {
            width: 75px; height: 75px; margin: 0 auto 20px;
            border-radius: 50%; background: #ecfdf3;
            border: 2px solid #22c55e;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
        }
        h1 { font-size: 30px; color: #111; margin-bottom: 10px; }
        h1 span { color: #22c55e; }
        .description { color: #666; font-size: 14px; line-height: 1.6; margin-bottom: 25px; }
        .email-display {
            background: #f5f5f5; border-radius: 8px;
            padding: 11px; margin-bottom: 22px;
            font-size: 13px; color: #555;
        }
        .email-display strong { color: #222; }
        .otp-container {
            display: flex; justify-content: center; gap: 10px;
            margin-bottom: 22px;
        }
        .otp-input {
            width: 48px; height: 55px;
            border: 1px solid #d5d5d5; border-radius: 8px;
            text-align: center; font-size: 22px; font-weight: bold;
            outline: none; transition: 0.2s;
        }
        .otp-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .verify-button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #22c55e; color: white; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: 0.25s;
        }
        .verify-button:hover { background: #16a34a; transform: translateY(-1px); }
        .verify-button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .timer { margin-top: 18px; color: #777; font-size: 13px; }
        .timer span { color: #16a34a; font-weight: bold; }
        .resend { margin-top: 15px; font-size: 13px; color: #777; }
        .resend button {
            border: none; background: none; color: #16a34a;
            font-size: 13px; font-weight: bold; cursor: pointer;
        }
        .resend button:disabled { color: #999; cursor: not-allowed; }
        .resend button:hover:not(:disabled) { text-decoration: underline; }
        .change-email {
            display: inline-block; margin-top: 22px;
            color: #555; font-size: 13px; text-decoration: none;
        }
        .change-email:hover { color: #22c55e; }
        .message {
            display: none; margin-top: 18px; padding: 11px;
            border-radius: 7px; font-size: 13px; line-height: 1.4;
        }
        .success { display: block; background: #ecfdf3; color: #15803d; border: 1px solid #bbf7d0; }
        .error { display: block; background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        .security-note {
            border-top: 1px solid #eeeeee; margin-top: 25px;
            padding-top: 18px; color: #888; font-size: 11px; line-height: 1.5;
        }
        @media (max-width: 500px) {
            body { padding: 15px; }
            .otp-card { padding: 30px 20px; border-radius: 15px; }
            h1 { font-size: 26px; }
            .otp-container { gap: 6px; }
            .otp-input { width: 42px; height: 50px; font-size: 20px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="otp-card">
        <div class="otp-icon">🔐</div>
        <h1>Verify <span>OTP</span></h1>
        <p class="description">
            Enter the 6-digit verification code sent to your email address to complete your account registration.
        </p>
        <div class="email-display">
            OTP sent to: <strong id="userEmail">student@example.com</strong>
        </div>
        <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" autofocus>
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
        </div>
        <button type="button" class="verify-button" id="verifyButton">Verify OTP</button>
        <div class="timer">OTP expires in: <span id="timer">02:00</span></div>
        <div class="resend">
            Didn't receive the code? <button type="button" id="resendButton" disabled>Resend OTP</button>
        </div>
        <div id="message" class="message"></div>
        <a href="student-signup.html" class="change-email">← Change Email Address</a>
        <div class="security-note">
            🔒 Never share your OTP with anyone. Our team will never ask you for your OTP.
        </div>
    </div>

    <!-- API CLIENT (backend-owned — do not modify) -->
    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>

    <script>
        (function () {
            const otpInputs = document.querySelectorAll(".otp-input");
            const verifyButton = document.getElementById("verifyButton");
            const resendButton = document.getElementById("resendButton");
            const message = document.getElementById("message");
            const timerElement = document.getElementById("timer");

            const email = sessionStorage.getItem("signupEmail");
            if (email) {
                document.getElementById("userEmail").textContent = maskEmail(email);
            }

            function maskEmail(email) {
                const parts = email.split("@");
                if (parts.length !== 2) return email;
                const username = parts[0], domain = parts[1];
                if (username.length <= 2) return "*".repeat(username.length) + "@" + domain;
                return username.charAt(0) + "*".repeat(username.length - 2) + username.charAt(username.length - 1) + "@" + domain;
            }

            // OTP input behavior
            otpInputs.forEach((input, index) => {
                input.addEventListener("input", function () {
                    this.value = this.value.replace(/\D/g, "").slice(0, 1);
                    if (this.value && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });
                input.addEventListener("keydown", function (event) {
                    if (event.key === "Backspace" && !this.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
                input.addEventListener("paste", function (event) {
                    event.preventDefault();
                    const pastedData = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
                    pastedData.split("").forEach((digit, i) => {
                        if (otpInputs[i]) otpInputs[i].value = digit;
                    });
                    if (pastedData.length === 6) otpInputs[5].focus();
                });
            });

            function getOTP() {
                let otp = "";
                otpInputs.forEach(input => { otp += input.value; });
                return otp;
            }

            // Verify button
            verifyButton.addEventListener("click", async function () {
                const otp = getOTP();
                if (otp.length !== 6) {
                    API.showMessage("message", "Please enter the complete 6-digit OTP.", "error");
                    return;
                }
                if (!email) {
                    API.showMessage("message", "Session expired. Please sign up again.", "error");
                    return;
                }

                verifyButton.disabled = true;
                verifyButton.textContent = "Verifying...";
                API.hideMessage("message");

                const res = await API.verifySignupOtp({ email: email, otp: otp });

                verifyButton.disabled = false;
                verifyButton.textContent = "Verify OTP";

                if (res.ok && res.data.success) {
                    API.showMessage("message", "Account verified successfully! Redirecting...", "success");
                    sessionStorage.removeItem("signupEmail");
                    setTimeout(function () {
                        API.redirectToDashboard(res.data.user.role);
                    }, 1200);
                } else {
                    API.showMessage("message", res.data.message || "Verification failed.", "error");
                }
            });

            // Countdown timer
            let timeLeft = 120;
            const countdown = setInterval(function () {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "Expired";
                    resendButton.disabled = false;
                }
                timeLeft--;
            }, 1000);

            // Resend OTP
            resendButton.addEventListener("click", async function () {
                if (!email) {
                    API.showMessage("message", "Session expired. Please sign up again.", "error");
                    return;
                }
                resendButton.disabled = true;
                resendButton.textContent = "Sending...";
                API.hideMessage("message");

                const res = await API.resendSignupOtp({ email: email });

                resendButton.textContent = "Resend OTP";
                if (res.ok && res.data.success) {
                    API.showMessage("message", "New OTP sent!", "success");
                    timeLeft = 120;
                    resendButton.disabled = true;
                } else {
                    API.showMessage("message", res.data.message || "Failed to resend OTP.", "error");
                    resendButton.disabled = false;
                }
            });
        })();
    </script>
</body>
</html>
