<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Fitness Performance Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            background: linear-gradient(rgba(5,15,25,0.80), rgba(5,15,25,0.90)),
                        url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                        center center / cover no-repeat;
        }
        .login-card {
            width: 100%; max-width: 420px;
            background: #ffffff; border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            text-align: center;
        }
        .icon {
            width: 70px; height: 70px; margin: 0 auto 20px;
            border-radius: 50%; background: #ecfdf3;
            border: 2px solid #22c55e;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 28px; color: #111; margin-bottom: 8px; }
        h1 span { color: #22c55e; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
        .form-group { text-align: left; margin-bottom: 18px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 8px; }
        input {
            width: 100%; padding: 14px 15px;
            border: 1px solid #d8d8d8; border-radius: 8px;
            font-size: 14px; outline: none; transition: 0.25s;
        }
        input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #22c55e; color: #ffffff; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: 0.25s; margin-top: 8px;
        }
        .button:hover { background: #16a34a; transform: translateY(-1px); }
        .button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .links {
            margin-top: 20px;
            display: flex; justify-content: space-between;
            font-size: 13px;
        }
        .links a { color: #555; text-decoration: none; }
        .links a:hover { color: #22c55e; }
        .message {
            display: none; margin-top: 15px; padding: 11px;
            border-radius: 7px; font-size: 13px;
        }
        .success { background: #ecfdf3; color: #15803d; border: 1px solid #bbf7d0; }
        .error { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        @media (max-width: 500px) {
            body { padding: 15px; }
            .login-card { padding: 30px 22px; border-radius: 15px; }
            h1 { font-size: 24px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="login-card">
        <div class="icon">🎓</div>
        <h1>Student <span>Login</span></h1>
        <p class="subtitle">Enter your credentials to access your dashboard.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@college.edu" autocomplete="email" required>
                <div id="emailError" class="field-error" style="display:none;color:#be123c;font-size:12px;margin-top:6px;"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
                <div id="passwordError" class="field-error" style="display:none;color:#be123c;font-size:12px;margin-top:6px;"></div>
            </div>
            <button type="submit" class="button" id="loginButton">Log In</button>
        </form>

        <div class="message" id="message"></div>

        <div class="links">
            <a href="forgot-password.html">Forgot Password?</a>
            <a href="student-signup.html">Create Account →</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>
    <script>
        (function () {
            const form = document.getElementById("loginForm");
            const btn = document.getElementById("loginButton");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");
            const emailError = document.getElementById("emailError");
            const passwordError = document.getElementById("passwordError");
            const msgEl = document.getElementById("message");

            if (!form || !btn) {
                console.error("[Login] Form or button not found!");
                return;
            }

            // Clear errors on input
            function clearErrors() {
                emailError.style.display = "none";
                emailError.textContent = "";
                emailInput.style.borderColor = "#d8d8d8";
                passwordError.style.display = "none";
                passwordError.textContent = "";
                passwordInput.style.borderColor = "#d8d8d8";
                API.hideMessage("message");
            }

            emailInput.addEventListener("input", clearErrors);
            passwordInput.addEventListener("input", clearErrors);

            form.addEventListener("submit", async function (e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                clearErrors();

                if (!email) {
                    emailError.textContent = "Enter your email address";
                    emailError.style.display = "block";
                    emailInput.style.borderColor = "#be123c";
                    emailInput.focus();
                    return;
                }

                if (!password) {
                    passwordError.textContent = "Enter your password";
                    passwordError.style.display = "block";
                    passwordInput.style.borderColor = "#be123c";
                    passwordInput.focus();
                    return;
                }

                btn.disabled = true;
                btn.textContent = "Logging in...";

                try {
                    const res = await API.login({ email: email, password: password, role: "student" });

                    btn.disabled = false;
                    btn.textContent = "Log In";

                    if (res.ok && res.data && res.data.success) {
                        API.showMessage("message", "Login successful! Redirecting...", "success");
                        setTimeout(function () {
                            window.location.href = "student-dashboard.html";
                        }, 800);
                    } else {
                        const msg = res.data.message || "Invalid email or password.";

                        // Google-style inline errors based on backend message
                        if (msg.includes("Couldn't find your account") || msg.includes("No account found")) {
                            emailError.textContent = "Couldn't find your account";
                            emailError.style.display = "block";
                            emailInput.style.borderColor = "#be123c";
                            emailInput.focus();
                        } 
                        else if (msg.includes("Invalid email or password")) {
                            passwordError.textContent = "Wrong password. Try again.";
                            passwordError.style.display = "block";
                            passwordInput.style.borderColor = "#be123c";
                            passwordInput.focus();
                        }
                        else {
                            // Fallback for any other error
                            API.showMessage("message", msg, "error");
                        }
                    }
                } catch (err) {
                    console.error("[Login] Unexpected error:", err);
                    API.showMessage("message", "Something went wrong. Please try again.", "error");
                    btn.disabled = false;
                    btn.textContent = "Log In";
                }
            });
        })();
    </script>
</body>
</html>
