<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Signup | Fitness Performance Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            background: linear-gradient(rgba(5,15,25,0.80), rgba(5,15,25,0.90)),
                        url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                        center center / cover no-repeat;
        }
        .signup-card {
            width: 100%; max-width: 460px;
            background: #ffffff; border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            text-align: center;
        }
        .icon {
            width: 70px; height: 70px; margin: 0 auto 20px;
            border-radius: 50%; background: #ecfdf3;
            border: 2px solid #22c55e;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
        }
        h1 { font-size: 28px; color: #111; margin-bottom: 8px; }
        h1 span { color: #22c55e; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 28px; }
        .form-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 12px 14px;
            border: 1px solid #d8d8d8; border-radius: 8px;
            font-size: 14px; outline: none; transition: 0.25s;
        }
        input:focus, select:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
        .hint { font-size: 11px; color: #888; margin-top: 4px; }
        .button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #22c55e; color: #ffffff; font-size: 14px; font-weight: bold;
            cursor: pointer; transition: 0.25s; margin-top: 8px;
        }
        .button:hover { background: #16a34a; transform: translateY(-1px); }
        .button:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }
        .links { margin-top: 20px; font-size: 13px; }
        .links a { color: #555; text-decoration: none; }
        .links a:hover { color: #22c55e; }
        .message {
            display: none; margin-top: 15px; padding: 11px;
            border-radius: 7px; font-size: 13px;
        }
        .success { background: #ecfdf3; color: #15803d; border: 1px solid #bbf7d0; }
        .error { background: #fff1f2; color: #be123c; border: 1px solid #fecdd3; }
        @media (max-width: 500px) {
            body { padding: 15px; }
            .signup-card { padding: 30px 22px; border-radius: 15px; }
            h1 { font-size: 24px; }
        }
    </style>
<base target="_blank">
</head>
<body>
    <div class="signup-card">
        <div class="icon">📝</div>
        <h1>Create <span>Account</span></h1>
        <p class="subtitle">Sign up as a student to track your fitness journey.</p>

        <form id="signupForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@college.edu" autocomplete="email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password" required>
                <div class="hint">Must be at least 8 characters.</div>
            </div>
            <div class="form-group">
                <label for="sport">Sport</label>
                <select id="sport">
                    <option value="">Select your sport</option>
                    <option value="Athletics">Athletics</option>
                    <option value="Basketball">Basketball</option>
                    <option value="Football">Football</option>
                    <option value="Cricket">Cricket</option>
                    <option value="Swimming">Swimming</option>
                </select>
            </div>
            <div class="form-group">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" placeholder="9876543210">
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender">
                    <option value="">Select</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob">
            </div>
            <button type="submit" class="button" id="signupButton">Sign Up</button>
        </form>

        <div class="message" id="message"></div>

        <div class="links">
            Already have an account? <a href="student-login.html">Log In →</a>
        </div>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/api-client.js"></script>
    <script>
        (function () {
            const form = document.getElementById("signupForm");
            const btn = document.getElementById("signupButton");

            form.addEventListener("submit", async function (e) {
                e.preventDefault();
                const name = document.getElementById("name").value.trim();
                const email = document.getElementById("email").value.trim();
                const password = document.getElementById("password").value;
                const sport = document.getElementById("sport").value;
                const contact = document.getElementById("contact").value.trim();
                const gender = document.getElementById("gender").value;
                const dob = document.getElementById("dob").value;

                if (password.length < 8) {
                    API.showMessage("message", "Password must be at least 8 characters.", "error");
                    return;
                }

                btn.disabled = true;
                btn.textContent = "Sending OTP...";
                API.hideMessage("message");

                const res = await API.register({
                    name: name,
                    email: email,
                    password: password,
                    role: "student",
                    sport: sport || null,
                    contact_number: contact || null,
                    gender: gender || null,
                    date_of_birth: dob || null
                });

                btn.disabled = false;
                btn.textContent = "Sign Up";

                if (res.ok && res.data.success) {
                    sessionStorage.setItem("signupEmail", email);
                    API.showMessage("message", "OTP sent! Redirecting...", "success");
                    setTimeout(function () {
                        window.location.href = "verify-signup.html";
                    }, 1000);
                } else {
                    API.showMessage("message", res.data.message || "Signup failed.", "error");
                }
            });
        })();
    </script>
</body>
</html>
