<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP | Fitness Performance Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(rgba(5,15,25,.8),rgba(5,15,25,.9)),url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85") center/cover no-repeat}
.otp-card{width:100%;max-width:470px;background:#fff;border-radius:20px;padding:40px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.otp-icon{width:75px;height:75px;margin:0 auto 20px;border-radius:50%;background:#ecfdf3;border:2px solid #22c55e;display:flex;align-items:center;justify-content:center;font-size:34px}
h1{font-size:30px;color:#111;margin-bottom:10px}h1 span{color:#22c55e}.description{color:#666;font-size:14px;line-height:1.6;margin-bottom:25px}
.email-display{background:#f5f5f5;border-radius:8px;padding:11px;margin-bottom:22px;font-size:13px;color:#555}.email-display strong{color:#222}
.otp-container{display:flex;justify-content:center;gap:10px;margin-bottom:22px}.otp-input{width:48px;height:55px;border:1px solid #d5d5d5;border-radius:8px;text-align:center;font-size:22px;font-weight:bold;outline:none}.otp-input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.12)}
.verify-button{width:100%;padding:14px;border:0;border-radius:8px;background:#22c55e;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}.verify-button:disabled{background:#9ca3af;cursor:not-allowed}
.timer{margin-top:18px;color:#777;font-size:13px}.timer span{color:#16a34a;font-weight:bold}.resend{margin-top:15px;font-size:13px;color:#777}.resend button{border:0;background:none;color:#16a34a;font-size:13px;font-weight:bold;cursor:pointer}.resend button:disabled{color:#999;cursor:not-allowed}
.change-email{display:inline-block;margin-top:22px;color:#555;font-size:13px;text-decoration:none}.change-email:hover{color:#22c55e}
.message{display:none;margin-top:18px;padding:11px;border-radius:7px;font-size:13px;line-height:1.4}.success{display:block;background:#ecfdf3;color:#15803d;border:1px solid #bbf7d0}.error{display:block;background:#fff1f2;color:#be123c;border:1px solid #fecdd3}
.security-note{border-top:1px solid #eee;margin-top:25px;padding-top:18px;color:#888;font-size:11px;line-height:1.5}
@media(max-width:500px){body{padding:15px}.otp-card{padding:30px 20px}.otp-container{gap:6px}.otp-input{width:42px;height:50px;font-size:20px}}
</style>
</head>
<body>
<div class="otp-card">
<div class="otp-icon">🔐</div>
<h1>Verify <span>OTP</span></h1>
<p class="description">Enter the 6-digit verification code sent to your registered email address.</p>
<div class="email-display">OTP sent to: <strong id="userEmail">••••</strong></div>
<div class="otp-container">
<input class="otp-input" maxlength="1" inputmode="numeric" autofocus>
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
<input class="otp-input" maxlength="1" inputmode="numeric">
</div>
<button type="button" class="verify-button" id="verifyButton">Verify OTP</button>
<div class="timer">OTP expires in: <span id="timer">10:00</span></div>
<div class="resend">Didn't receive the code? <button type="button" id="resendButton" disabled>Resend OTP</button></div>
<div id="message" class="message"></div>
<a href="forgot-password.html" class="change-email">← Change Email Address</a>
<div class="security-note">🔒 Never share your OTP with anyone. Our team will never ask you for your OTP.</div>
</div>
<script>
const email=sessionStorage.getItem("resetEmail");
if(!email){window.location.href="forgot-password.html";}
const emailElement=document.getElementById("userEmail");
const inputs=[...document.querySelectorAll(".otp-input")];
const verifyButton=document.getElementById("verifyButton");
const resendButton=document.getElementById("resendButton");
const message=document.getElementById("message");
const timerElement=document.getElementById("timer");

function maskEmail(value){
    const parts=value.split("@");
    if(parts.length!==2)return value;
    const u=parts[0],d=parts[1];
    if(u.length<=2)return "*".repeat(u.length)+"@"+d;
    return u[0]+"*".repeat(u.length-2)+u[u.length-1]+"@"+d;
}
emailElement.textContent=maskEmail(email);

function showMessage(text,type){
    message.textContent=text;
    message.className="message "+type;
}
function getOtp(){return inputs.map(i=>i.value).join("");}

inputs.forEach((input,index)=>{
    input.addEventListener("input",()=>{
        input.value=input.value.replace(/\D/g,"").slice(0,1);
        if(input.value && index<inputs.length-1)inputs[index+1].focus();
    });
    input.addEventListener("keydown",(e)=>{
        if(e.key==="Backspace"&&!input.value&&index>0)inputs[index-1].focus();
    });
    input.addEventListener("paste",(e)=>{
        e.preventDefault();
        const value=e.clipboardData.getData("text").replace(/\D/g,"").slice(0,6);
        value.split("").forEach((digit,i)=>{if(inputs[i])inputs[i].value=digit;});
        if(value.length===6)inputs[5].focus();
    });
});

verifyButton.addEventListener("click",async()=>{
    const otp=getOtp();
    if(otp.length!==6){showMessage("Please enter the complete 6-digit OTP.","error");return;}

    verifyButton.disabled=true;
    verifyButton.textContent="Verifying...";

    try{
        const response=await fetch("/api/forgot-password/verify-otp",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({email,otp})
        });
        const result=await response.json();
        if(!response.ok||result.success!==true)throw new Error(result.message||"Invalid OTP.");

        sessionStorage.setItem("resetOtp",otp);
        showMessage("OTP verified successfully.","success");
        setTimeout(()=>window.location.href="reset-password.html",500);
    }catch(error){
        showMessage(error.message,"error");
        verifyButton.disabled=false;
        verifyButton.textContent="Verify OTP";
    }
});

let timeLeft=600;
let timerId=setInterval(()=>{
    const minutes=Math.floor(timeLeft/60);
    const seconds=timeLeft%60;
    timerElement.textContent=String(minutes).padStart(2,"0")+":"+String(seconds).padStart(2,"0");
    if(timeLeft<=0){
        clearInterval(timerId);
        resendButton.disabled=false;
        timerElement.textContent="Expired";
    }else timeLeft--;
},1000);

resendButton.addEventListener("click",async()=>{
    resendButton.disabled=true;
    resendButton.textContent="Sending...";
    try{
        const response=await fetch("/api/forgot-password/resend-otp",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({email})
        });
        const result=await response.json();
        if(!response.ok||result.success!==true)throw new Error(result.message||"Unable to resend OTP.");
        inputs.forEach(i=>i.value="");
        sessionStorage.removeItem("resetOtp");
        timeLeft=600;
        timerElement.textContent="10:00";
        resendButton.disabled=true;
        showMessage("A new OTP has been sent to your email.","success");
    }catch(error){
        showMessage(error.message,"error");
        resendButton.disabled=false;
    }finally{
        resendButton.textContent="Resend OTP";
    }
});
</script>
</body>
</html>
