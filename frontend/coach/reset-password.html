<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Fitness Performance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#22c55e',
                            hover: '#16a34a',
                            light: '#f0fdf4'
                        }
                    }
                }
            }
        }
    </script>

</head>


<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans">


<div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8 sm:p-12">


    <!-- Icon -->

    <div class="w-16 h-16 mx-auto rounded-full bg-brand-light border-2 border-brand/40 flex items-center justify-center text-3xl">

        🔑

    </div>


    <div class="text-center mt-5">

        <h1 class="text-3xl font-black text-slate-900">

            Reset <span class="text-brand">Password</span>

        </h1>


        <p class="text-sm text-slate-500 mt-3">

            Create a new password for your coach account.

        </p>

    </div>


    <form id="resetForm" class="mt-8 space-y-5">


        <!-- New Password -->

        <div>

            <label
                for="password"
                class="block text-xs font-bold text-slate-800 mb-2">

                New Password

            </label>


            <div class="relative">

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                    placeholder="Enter new password"
                    class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-lg outline-none focus:border-brand focus:ring-1 focus:ring-brand"
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">

                    👁

                </button>

            </div>

        </div>


        <!-- Confirm -->

        <div>

            <label
                for="confirmPassword"
                class="block text-xs font-bold text-slate-800 mb-2">

                Confirm New Password

            </label>


            <div class="relative">

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    placeholder="Confirm new password"
                    class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-lg outline-none focus:border-brand focus:ring-1 focus:ring-brand"
                >


                <button
                    type="button"
                    id="toggleConfirm"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400">

                    👁

                </button>

            </div>

        </div>


        <!-- Message -->

        <div
            id="message"
            class="hidden rounded-lg p-3 text-xs">
        </div>


        <!-- Button -->

        <button
            type="submit"
            id="resetButton"
            class="w-full py-3.5 bg-brand hover:bg-brand-hover text-white font-bold rounded-xl transition">

            Reset Password →

        </button>

    </form>


    <a
        href="coach-login.html"
        class="block text-center mt-6 text-sm text-slate-500 hover:text-brand">

        ← Back to Coach Login

    </a>


    <div class="border-t border-slate-100 mt-7 pt-5 text-center text-xs text-slate-400">

        🔒 Your password is securely protected.

    </div>

</div>



<script>


function setupPasswordToggle(buttonId, inputId) {

    const button =
        document.getElementById(buttonId);

    const input =
        document.getElementById(inputId);


    button.addEventListener("click", function() {

        if (input.type === "password") {

            input.type = "text";
            button.textContent = "🙈";

        } else {

            input.type = "password";
            button.textContent = "👁";

        }

    });

}


setupPasswordToggle(
    "togglePassword",
    "password"
);


setupPasswordToggle(
    "toggleConfirm",
    "confirmPassword"
);



document.getElementById("resetForm").addEventListener("submit", function(event) {

    event.preventDefault();


    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    const button =
        document.getElementById("resetButton");


    message.className =
        "hidden";


    if (password.length < 6) {

        message.textContent =
            "Password must contain at least 6 characters.";

        message.className =
            "rounded-lg p-3 text-xs bg-red-50 border border-red-200 text-red-600";

        return;

    }


    if (password !== confirmPassword) {

        message.textContent =
            "Passwords do not match.";

        message.className =
            "rounded-lg p-3 text-xs bg-red-50 border border-red-200 text-red-600";

        return;

    }


    button.disabled = true;
    button.textContent = "Resetting Password...";


    setTimeout(function() {

        /*
         * Password reset successful.
         */

        message.textContent =
            "Password reset successfully! Redirecting to login...";

        message.className =
            "rounded-lg p-3 text-xs bg-green-50 border border-green-200 text-green-700";


        setTimeout(function() {

            window.location.href =
                "coach-login.html";

        }, 1200);

    }, 1000);

});

</script>

</body>
</html>
