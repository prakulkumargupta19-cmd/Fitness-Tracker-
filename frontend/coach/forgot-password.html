<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Fitness Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif']},colors:{brand:{DEFAULT:'#22c55e',hover:'#16a34a',light:'#f0fdf4'}}}}}
</script>
</head>
<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans">
<div class="relative w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8 sm:p-12">
<div class="w-16 h-16 mx-auto rounded-full bg-brand-light border-2 border-brand/40 flex items-center justify-center text-3xl">🔐</div>
<div class="text-center mt-5">
<h1 class="text-3xl font-black text-slate-900">Forgot <span class="text-brand">Password?</span></h1>
<p class="text-sm text-slate-500 mt-3 leading-relaxed">Enter your registered coach email address. We'll send you a 6-digit verification code.</p>
</div>
<form id="emailForm" class="mt-8">
<label for="email" class="block text-xs font-bold text-slate-800 mb-2">Coach Email</label>
<input type="email" id="email" required placeholder="Enter your coach email" class="w-full px-4 py-3 border border-slate-200 rounded-lg outline-none focus:border-brand focus:ring-1 focus:ring-brand">
<div id="message" class="hidden mt-4 rounded-lg p-3 text-xs"></div>
<button type="submit" id="sendButton" class="w-full mt-5 py-3.5 bg-brand hover:bg-brand-hover text-white font-bold rounded-xl transition">Send Verification Code →</button>
</form>
<a href="coach-login.html" class="block text-center mt-6 text-sm text-slate-500 hover:text-brand">← Back to Coach Login</a>
<div class="border-t border-slate-100 mt-7 pt-5 text-center text-xs text-slate-400">🔒 Your account information is securely protected.</div>
</div>
<script>
const form=document.getElementById("emailForm");
const button=document.getElementById("sendButton");
const message=document.getElementById("message");

function showMessage(text,ok=false){
    message.textContent=text;
    message.className=ok
        ? "mt-4 rounded-lg p-3 text-xs bg-green-50 border border-green-200 text-green-700"
        : "mt-4 rounded-lg p-3 text-xs bg-red-50 border border-red-200 text-red-600";
}

form.addEventListener("submit",async function(event){
    event.preventDefault();
    const email=document.getElementById("email").value.trim().toLowerCase();
    if(!email) return;

    button.disabled=true;
    button.textContent="Sending Code...";

    try{
        const response=await fetch("/api/forgot-password",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            credentials:"include",
            body:JSON.stringify({email})
        });

        const result=await response.json();

        if(!response.ok || result.success!==true){
            throw new Error(result.message || "Unable to send OTP.");
        }

        sessionStorage.setItem("resetEmail",email);
        sessionStorage.removeItem("resetOtp");
        window.location.href="verify.html";
    }catch(error){
        showMessage(error.message);
        button.disabled=false;
        button.textContent="Send Verification Code →";
    }
});
</script>
</body>
</html>
