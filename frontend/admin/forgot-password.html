<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Inter, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5,15,25,.88),
                    rgba(5,15,25,.95)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center/cover no-repeat;
        }

        .card {
            width: 100%;
            max-width: 450px;

            background: white;

            padding: 45px;

            border-radius: 24px;

            box-shadow: 0 25px 60px rgba(0,0,0,.45);

            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: auto auto 25px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;

            background: #f0fdf4;

            border: 2px solid #22c55e;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #0f172a;
        }

        h1 span {
            color: #22c55e;
        }

        p {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            text-align: left;

            font-size: 13px;
            font-weight: 700;

            margin-bottom: 8px;
            color: #334155;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;

            margin-bottom: 20px;
        }

        input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34,197,94,.12);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 9px;

            background: #22c55e;
            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .back {
            display: block;

            margin-top: 22px;

            color: #16a34a;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            <span>Forgot</span> Password?
        </h1>

        <p>
            Enter your admin email address and we will
            help you reset your password.
        </p>

        <form id="forgotForm">

            <label for="email">
                Admin Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your admin email"
                required
            >

            <button type="submit">
                Continue →
            </button>

        </form>

        <a
            href="admin-login.html"
            class="back"
        >
            ← Back to Admin Login
        </a>

    </div>


    <script>

        document
            .getElementById("forgotForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Verification code sent successfully!");

                window.location.href = "verify.html";

            });

    </script>

</body>
</html>
