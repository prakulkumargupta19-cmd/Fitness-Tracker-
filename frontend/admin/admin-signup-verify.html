<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Admin OTP | Fitness Performance Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #061522, #102f44);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.30);
        }

        .icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 18px;

            border-radius: 16px;

            background: #22c55e;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {
            margin: 0;

            font-size: 28px;

            color: #0f172a;
        }

        h1 span {
            color: #22c55e;
        }

        .subtitle {
            margin-top: 10px;
            margin-bottom: 22px;

            color: #64748b;

            font-size: 14px;
        }

        .email-box {
            background: #f1f5f9;

            padding: 13px;

            border-radius: 9px;

            font-size: 13px;

            color: #475569;

            margin-bottom: 24px;
        }

        .email-box strong {
            color: #0f172a;
        }

        .otp-container {
            display: flex;

            justify-content: center;

            gap: 8px;

            margin-bottom: 22px;
        }

        .otp {
            width: 48px;
            height: 55px;

            border: 1px solid #d5dce5;

            border-radius: 9px;

            text-align: center;

            font-size: 22px;

            font-weight: bold;

            outline: none;
        }

        .otp:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        #verifyBtn {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 9px;

            background: #22c55e;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        #verifyBtn:hover {
            background: #16a34a;
        }

        #verifyBtn:disabled {
            background: #94a3b8;

            cursor: not-allowed;
        }

        .timer {
            margin-top: 18px;

            color: #64748b;

            font-size: 13px;
        }

        .timer strong {
            color: #16a34a;
        }

        .resend {
            margin-top: 16px;

            color: #64748b;

            font-size: 13px;
        }

        #resendBtn {
            border: none;

            background: transparent;

            color: #16a34a;

            font-weight: bold;

            cursor: pointer;
        }

        #resendBtn:disabled {
            color: #94a3b8;

            cursor: not-allowed;
        }

        #message {
            display: none;

            margin-top: 18px;

            padding: 12px;

            border-radius: 9px;

            font-size: 13px;
        }

        #message.error {
            display: block;

            background: #fff1f2;

            color: #be123c;
        }

        #message.success {
            display: block;

            background: #ecfdf5;

            color: #15803d;
        }

        .change-email {
            display: block;

            margin-top: 20px;

            color: #64748b;

            font-size: 13px;

            text-decoration: none;
        }

        .change-email:hover {
            color: #16a34a;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        🔐
    </div>

    <h1>
        Verify <span>Admin Account</span>
    </h1>

    <p class="subtitle">
        Enter the 6-digit OTP sent to your email address.
    </p>

    <div class="email-box">
        OTP sent to:
        <strong id="emailDisplay">Loading...</strong>
    </div>

    <div class="otp-container">

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
            autocomplete="one-time-code"
            autofocus
        >

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
        >

        <input
            class="otp"
            maxlength="1"
            inputmode="numeric"
        >

    </div>

    <button
        type="button"
        id="verifyBtn"
    >
        Verify OTP
    </button>

    <div class="timer">
        OTP expires in:
        <strong id="timer">10:00</strong>
    </div>

    <div class="resend">

        Didn't receive the code?

        <button
            type="button"
            id="resendBtn"
            disabled
        >
            Resend OTP
        </button>

    </div>

    <div id="message"></div>

    <a
        href="admin-signup.html"
        class="change-email"
    >
        ← Change Email
    </a>

</div>


<script>

"use strict";


/* =====================================================
   BACKEND
===================================================== */

const API_URL =
    "http://127.0.0.1:5000";


/* =====================================================
   GET EMAIL FROM SIGNUP PAGE
===================================================== */

const email =
    sessionStorage.getItem("adminSignupEmail") ||
    localStorage.getItem("adminSignupEmail") ||
    localStorage.getItem("adminEmail");


/* =====================================================
   ELEMENTS
===================================================== */

const emailDisplay =
    document.getElementById("emailDisplay");

const verifyBtn =
    document.getElementById("verifyBtn");

const resendBtn =
    document.getElementById("resendBtn");

const message =
    document.getElementById("message");

const timerElement =
    document.getElementById("timer");

const otpInputs =
    document.querySelectorAll(".otp");


/* =====================================================
   CHECK EMAIL
===================================================== */

if (!email) {

    alert(
        "Signup session not found. Please create the admin account again."
    );

    window.location.replace(
        "admin-signup.html"
    );
}


/* =====================================================
   MASK EMAIL
===================================================== */

function maskEmail(email) {

    const parts =
        email.split("@");

    if (parts.length !== 2) {
        return email;
    }

    const username =
        parts[0];

    const domain =
        parts[1];

    if (username.length <= 2) {

        return (
            "*".repeat(username.length) +
            "@" +
            domain
        );
    }

    return (
        username.charAt(0) +
        "*".repeat(
            Math.max(
                username.length - 2,
                1
            )
        ) +
        username.charAt(
            username.length - 1
        ) +
        "@" +
        domain
    );
}


if (email) {

    emailDisplay.textContent =
        maskEmail(email);
}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        type;
}


/* =====================================================
   OTP INPUT
===================================================== */

otpInputs.forEach(
    function(input, index) {

        input.addEventListener(
            "input",
            function() {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 1);

                if (
                    this.value &&
                    index <
                    otpInputs.length - 1
                ) {

                    otpInputs[
                        index + 1
                    ].focus();
                }
            }
        );


        input.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Backspace" &&
                    !this.value &&
                    index > 0
                ) {

                    otpInputs[
                        index - 1
                    ].focus();
                }
            }
        );


        input.addEventListener(
            "paste",
            function(event) {

                event.preventDefault();

                const pasted =
                    event.clipboardData
                        .getData("text")
                        .replace(/\D/g, "")
                        .slice(0, 6);


                pasted
                    .split("")
                    .forEach(
                        function(
                            digit,
                            i
                        ) {

                            if (
                                otpInputs[i]
                            ) {

                                otpInputs[i]
                                    .value =
                                    digit;
                            }
                        }
                    );


                if (
                    pasted.length === 6
                ) {

                    otpInputs[5]
                        .focus();
                }
            }
        );
    }
);


/* =====================================================
   GET OTP
===================================================== */

function getOTP() {

    return Array.from(
        otpInputs
    )
    .map(
        function(input) {
            return input.value;
        }
    )
    .join("");
}


/* =====================================================
   VERIFY ADMIN OTP
===================================================== */

verifyBtn.addEventListener(
    "click",
    async function() {

        const otp =
            getOTP();


        if (
            otp.length !== 6
        ) {

            showMessage(
                "Please enter the complete 6-digit OTP.",
                "error"
            );

            return;
        }


        verifyBtn.disabled =
            true;

        verifyBtn.textContent =
            "Verifying...";


        try {

            const response =
                await fetch(
                    API_URL +
                    "/api/admin-signup/verify-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        /* CRITICAL: the backend sets the
                           session cookie on this response.
                           Without credentials:"include" the
                           browser discards it (cross-origin)
                           and the dashboard guard will bounce
                           you back to login. */
                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                email:
                                    email,

                                otp:
                                    otp
                            })
                    }
                );


            const result =
                await response.json();


            console.log(
                "ADMIN OTP RESULT:",
                result
            );


            /* =========================================
               ONLY SUCCESS CAN OPEN DASHBOARD
            ========================================= */

            if (
                response.ok &&
                result.success === true
            ) {

                showMessage(
                    "OTP verified successfully. Opening Admin Dashboard...",
                    "success"
                );


                /* Store admin session */

                localStorage.setItem(
                    "adminVerified",
                    "true"
                );

                localStorage.setItem(
                    "adminEmail",
                    email
                );


                if (
                    result.user_code
                ) {

                    localStorage.setItem(
                        "adminUserCode",
                        result.user_code
                    );
                }


                /* Clear temporary signup email */

                sessionStorage.removeItem(
                    "adminSignupEmail"
                );


                /*
                 * IMPORTANT:
                 *
                 * THIS IS THE ADMIN DASHBOARD.
                 */

                setTimeout(
                    function() {

                        window.location.replace(
                            "admin-dashboard.html"
                        );

                    },
                    700
                );


                return;
            }


            /* =========================================
               OTP FAILED
            ========================================= */

            throw new Error(
                result.message ||
                "OTP verification failed."
            );

        }

        catch(error) {

            console.error(
                "ADMIN OTP ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Unable to verify OTP.",
                "error"
            );


            verifyBtn.disabled =
                false;

            verifyBtn.textContent =
                "Verify OTP";
        }
    }
);


/* =====================================================
   TIMER
===================================================== */

let secondsLeft =
    600;


function updateTimer() {

    const minutes =
        Math.floor(
            secondsLeft / 60
        );

    const seconds =
        secondsLeft % 60;


    timerElement.textContent =
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        );


    if (
        secondsLeft <= 0
    ) {

        clearInterval(
            countdown
        );

        timerElement.textContent =
            "Expired";

        resendBtn.disabled =
            false;

        return;
    }


    secondsLeft--;
}


const countdown =
    setInterval(
        updateTimer,
        1000
    );


updateTimer();


/* =====================================================
   RESEND ADMIN OTP
===================================================== */

resendBtn.addEventListener(
    "click",
    async function() {

        resendBtn.disabled =
            true;

        resendBtn.textContent =
            "Sending...";


        try {

            const response =
                await fetch(
                    API_URL +
                    "/api/admin-signup/resend-otp",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                email:
                                    email
                            })
                    }
                );


            const result =
                await response.json();


            if (
                !response.ok ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Unable to resend OTP."
                );
            }


            secondsLeft =
                600;


            showMessage(
                "A new OTP has been sent to your email.",
                "success"
            );

        }

        catch(error) {

            showMessage(
                error.message ||
                "Unable to resend OTP.",
                "error"
            );
        }


        resendBtn.disabled =
            false;

        resendBtn.textContent =
            "Resend OTP";
    }
);

</script>

</body>
</html>
