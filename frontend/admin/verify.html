<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Account | Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Inter, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5,15,25,.88),
                    rgba(5,15,25,.95)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center/cover no-repeat;
        }

        .card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 45px;

            border-radius: 24px;

            text-align: center;

            box-shadow: 0 25px 60px rgba(0,0,0,.45);
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #f0fdf4;

            border: 2px solid #22c55e;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {

            font-size: 29px;

            color: #0f172a;

            margin-bottom: 10px;
        }

        h1 span {
            color: #22c55e;
        }

        p {

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .code-input {

            width: 100%;

            padding: 15px;

            text-align: center;

            font-size: 24px;

            letter-spacing: 8px;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            margin-bottom: 20px;
        }

        .code-input:focus {

            border-color: #22c55e;

            box-shadow: 0 0 0 3px rgba(34,197,94,.12);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #22c55e;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .resend {

            margin-top: 20px;

            font-size: 13px;

            color: #64748b;
        }

        .resend a {

            color: #16a34a;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            ✓
        </div>

        <h1>
            <span>Verify</span> Account
        </h1>

        <p>
            Enter the verification code sent to your
            registered admin email address.
        </p>

        <form id="verifyForm">

            <input
                type="text"
                id="code"
                class="code-input"
                maxlength="6"
                inputmode="numeric"
                placeholder="------"
                required
            >

            <button type="submit">
                Verify Code →
            </button>

        </form>

        <div class="resend">

            Didn't receive the code?

            <a href="#" onclick="resendCode(event)">
                Resend Code
            </a>

        </div>

    </div>


    <script>

        document
            .getElementById("verifyForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const code =
                    document.getElementById("code").value.trim();

                if (code.length !== 6) {

                    alert("Please enter the 6-digit verification code.");

                    return;
                }

                alert("Account verified successfully!");

                window.location.href = "reset-password.html";

            });


        function resendCode(event) {

            event.preventDefault();

            alert("A new verification code has been sent.");

        }

    </script>

</body>

</html>
