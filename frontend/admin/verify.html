<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Admin</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5, 15, 25, 0.80),
                    rgba(5, 15, 25, 0.90)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center center / cover no-repeat;
        }

        /* =================================
           MAIN CARD
        ================================= */

        .otp-card {
            width: 100%;
            max-width: 470px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* =================================
           ICON
        ================================= */

        .otp-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;

            background: #ecfdf3;
            border: 2px solid #62bbe8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
        }

        /* =================================
           HEADING
        ================================= */

        h1 {
            font-size: 30px;
            color: #111;
            margin-bottom: 10px;
        }

        h1 span {
            color: #000000;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* =================================
           EMAIL DISPLAY
        ================================= */

        .email-display {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 11px;
            margin-bottom: 22px;

            font-size: 13px;
            color: #555;
        }

        .email-display strong {
            color: #222;
        }

        /* =================================
           OTP INPUTS
        ================================= */

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .otp-input {
            width: 48px;
            height: 55px;

            border: 1px solid #d5d5d5;
            border-radius: 8px;

            text-align: center;
            font-size: 22px;
            font-weight: bold;

            outline: none;
            transition: 0.2s;
        }

        .otp-input:focus {
            border-color: #62bbe8;

            box-shadow:
                0 0 0 3px rgba(34, 197, 94, 0.12);
        }

        /* =================================
           VERIFY BUTTON
        ================================= */

        .verify-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #62bbe8;
            color: white;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.25s;
        }

        .verify-button:hover {
            background: #46a1ce;
            transform: translateY(-1px);
        }

        .verify-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* =================================
           TIMER
        ================================= */

        .timer {
            margin-top: 18px;
            color: #777;
            font-size: 13px;
        }

        .timer span {
            color: #46a1ce;
            font-weight: bold;
        }

        /* =================================
           RESEND OTP
        ================================= */

        .resend {
            margin-top: 15px;
            font-size: 13px;
            color: #777;
        }

        .resend button {
            border: none;
            background: none;

            color: #46a1ce;
            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }

        .resend button:disabled {
            color: #999;
            cursor: not-allowed;
        }

        .resend button:hover:not(:disabled) {
            text-decoration: underline;
        }

        /* =================================
           CHANGE EMAIL
        ================================= */

        .change-email {
            display: inline-block;
            margin-top: 22px;

            color: #555;
            font-size: 13px;

            text-decoration: none;
        }

        .change-email:hover {
            color: #62bbe8;
        }

        /* =================================
           MESSAGE
        ================================= */

        .message {
            display: none;

            margin-top: 18px;
            padding: 11px;

            border-radius: 7px;

            font-size: 13px;
            line-height: 1.4;
        }

        .success {
            display: block;
            background: #ecfdf3;
            color: #62bbe8;
            border: 1px solid #bbf7d0;
        }

        .error {
            display: block;
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        /* =================================
           SECURITY NOTE
        ================================= */

        .security-note {
            border-top: 1px solid #eeeeee;

            margin-top: 25px;
            padding-top: 18px;

            color: #888;
            font-size: 11px;
            line-height: 1.5;
        }

        /* =================================
           MOBILE
        ================================= */

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .otp-card {
                padding: 30px 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 26px;
            }

            .otp-container {
                gap: 6px;
            }

            .otp-input {
                width: 42px;
                height: 50px;
                font-size: 20px;
            }
        }
    </style>

</head>

<body>

    <!-- =================================
         OTP CARD
    ================================= -->

    <div class="otp-card">

        <!-- ICON -->

        <div class="otp-icon">
            🔐
        </div>

        <!-- HEADING -->

        <h1>
            <span>Verify</span> OTP
        </h1>

        <p class="description">
            Enter the 6-digit verification code
            sent to your email.
        </p>

        <!-- =================================
             EMAIL
        ================================= -->

        <div class="email-display">

            OTP sent to:

            <strong id="userEmail">
                Loading...
            </strong>

        </div>

        <!-- =================================
             OTP INPUTS
        ================================= -->

        <div class="otp-container">

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
                autofocus
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
            >

        </div>

        <!-- =================================
             VERIFY BUTTON
        ================================= -->

        <button
            type="button"
            class="verify-button"
            id="verifyButton"
        >
            Verify OTP
        </button>

        <!-- =================================
             TIMER
        ================================= -->

        <div class="timer">

            OTP expires in:

            <span id="timer">
                02:00
            </span>

        </div>

        <!-- =================================
             RESEND
        ================================= -->

        <div class="resend">

            Didn't receive the code?

            <button
                type="button"
                id="resendButton"
                disabled
            >
                Resend OTP
            </button>

        </div>

        <!-- =================================
             MESSAGE
        ================================= -->

        <div
            id="message"
            class="message"
        ></div>

        <!-- =================================
             CHANGE EMAIL
        ================================= -->

        <a
            href="forgot-password.html"
            class="change-email"
        >
            ← Change Email Address
        </a>

        <!-- =================================
             SECURITY
        ================================= -->

        <div class="security-note">

            🔒 Never share your OTP with anyone.
            Our team will never ask you for your OTP.

        </div>

    </div>

    <!-- =================================
         JAVASCRIPT
    ================================= -->

    <script>

        /* =========================================
            FLASK BACKEND
        ========================================= */

        const API_BASE_URL =
            "http://127.0.0.1:5000";


        /* =========================================
            ELEMENTS
        ========================================= */

        const otpInputs =
            document.querySelectorAll(
                ".otp-input"
            );

        const verifyButton =
            document.getElementById(
                "verifyButton"
            );

        const resendButton =
            document.getElementById(
                "resendButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        const timerElement =
            document.getElementById(
                "timer"
            );

        const userEmail =
            document.getElementById(
                "userEmail"
            );


        /* =========================================
            GET EMAIL

            Priority:
            1. URL parameter
            2. sessionStorage
            3. localStorage
            4. Fallback placeholder
        ========================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const urlEmail =
            urlParams.get("email");


        let email =
            urlEmail ||
            sessionStorage.getItem(
                "resetEmail"
            ) ||
            localStorage.getItem(
                "resetEmail"
            ) ||
            "admin@example.com";


        console.log(
            "RESET EMAIL:",
            email
        );


        /* =========================================
            SAVE AND DISPLAY EMAIL
        ========================================= */

        if (email) {

            sessionStorage.setItem(
                "resetEmail",
                email
            );

            localStorage.setItem(
                "resetEmail",
                email
            );

            userEmail.textContent =
                maskEmail(email);

        }
        else {

            userEmail.textContent =
                "admin@example.com";

        }


        /* =========================================
            MASK EMAIL
        ========================================= */

        function maskEmail(email) {

            const parts =
                email.split("@");


            if (parts.length !== 2) {
                return email;
            }


            const username =
                parts[0];

            const domain =
                parts[1];


            if (username.length <= 2) {

                return (
                    "*".repeat(
                        username.length
                    )
                    +
                    "@"
                    +
                    domain
                );

            }


            return (
                username.charAt(0)
                +
                "*".repeat(
                    username.length - 2
                )
                +
                username.charAt(
                    username.length - 1
                )
                +
                "@"
                +
                domain
            );

        }


        /* =========================================
            OTP INPUT
        ========================================= */

        otpInputs.forEach(
            function(input, index) {

                input.addEventListener(
                    "input",
                    function() {

                        this.value =
                            this.value
                                .replace(
                                    /\D/g,
                                    ""
                                )
                                .slice(0, 1);


                        if (
                            this.value &&
                            index <
                            otpInputs.length - 1
                        ) {

                            otpInputs[
                                index + 1
                            ].focus();

                        }

                    }
                );


                input.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key ===
                            "Backspace" &&
                            !this.value &&
                            index > 0
                        ) {

                            otpInputs[
                                index - 1
                            ].focus();

                        }

                    }
                );


                input.addEventListener(
                    "paste",
                    function(event) {

                        event.preventDefault();


                        const pasted =
                            event
                                .clipboardData
                                .getData("text")
                                .replace(
                                    /\D/g,
                                    ""
                                )
                                .slice(0, 6);


                        pasted
                            .split("")
                            .forEach(
                                function(
                                    digit,
                                    i
                                ) {

                                    if (
                                        otpInputs[i]
                                    ) {

                                        otpInputs[i]
                                            .value =
                                            digit;

                                    }

                                }
                            );


                        if (
                            pasted.length === 6
                        ) {

                            otpInputs[5]
                                .focus();

                        }

                    }
                );

            }
        );


        /* =========================================
            GET OTP
        ========================================= */

        function getOTP() {

            let otp = "";


            otpInputs.forEach(
                function(input) {

                    otp += input.value;

                }
            );


            return otp;

        }


        /* =========================================
            MESSAGE
        ========================================= */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                "message " + type;

        }


        /* =========================================
            VERIFY OTP
        ========================================= */

        verifyButton.addEventListener(
            "click",
            async function() {

                const otp =
                    getOTP();


                if (
                    otp.length !== 6
                ) {

                    showMessage(
                        "Please enter the complete 6-digit OTP.",
                        "error"
                    );

                    return;

                }


                if (!email) {

                    showMessage(
                        "Please enter a valid OTP.",
                        "error"
                    );

                    return;

                }


                verifyButton.disabled =
                    true;

                verifyButton.textContent =
                    "Verifying...";


                try {

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/verify-otp`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            email,
                                        otp:
                                            otp
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "VERIFY RESPONSE:",
                        data
                    );


                    if (
                        response.ok &&
                        data.success
                    ) {

                        sessionStorage.setItem(
                            "resetOtp",
                            otp
                        );

                        localStorage.setItem(
                            "resetOtp",
                            otp
                        );


                        showMessage(
                            "OTP verified successfully.",
                            "success"
                        );


                        setTimeout(
                            function() {

                                window.location.href =
                                    "reset-password.html";

                            },
                            700
                        );


                        return;

                    }


                    showMessage(
                        data.message ||
                        "Invalid or expired OTP.",
                        "error"
                    );

                }
                catch (error) {

                    console.error(
                        "VERIFY ERROR:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );

                }
                finally {

                    verifyButton.disabled =
                        false;

                    verifyButton.textContent =
                        "Verify OTP";

                }

            }
        );


        /* =========================================
            TIMER
        ========================================= */

        let timeLeft = 120;


        let countdown =
            setInterval(
                updateTimer,
                1000
            );


        function updateTimer() {

            const minutes =
                Math.floor(
                    timeLeft / 60
                );

            const seconds =
                timeLeft % 60;


            timerElement.textContent =
                String(minutes)
                    .padStart(2, "0")
                +
                ":"
                +
                String(seconds)
                    .padStart(2, "0");


            if (
                timeLeft <= 0
            ) {

                clearInterval(
                    countdown
                );


                timerElement.textContent =
                    "Expired";


                resendButton.disabled =
                    false;


                return;

            }


            timeLeft--;

        }


        /* =========================================
            RESEND OTP
        ========================================= */

        resendButton.addEventListener(
            "click",
            async function() {

                if (!email) {

                    return;

                }


                resendButton.disabled =
                    true;

                resendButton.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            `${API_BASE_URL}/api/forgot-password`,
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email:
                                            email
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    console.log(
                        "RESEND RESPONSE:",
                        data
                    );


                    if (
                        response.ok &&
                        data.success
                    ) {

                        otpInputs.forEach(
                            function(input) {
                                input.value = "";
                            }
                        );


                        otpInputs[0].focus();


                        timeLeft = 120;


                        clearInterval(
                            countdown
                        );


                        countdown =
                            setInterval(
                                updateTimer,
                                1000
                            );


                        showMessage(
                            "A new OTP has been sent to your email.",
                            "success"
                        );

                    }
                    else {

                        showMessage(
                            data.message ||
                            "Unable to resend OTP.",
                            "error"
                        );


                        resendButton.disabled =
                            false;

                    }

                }
                catch (error) {

                    console.error(
                        "RESEND ERROR:",
                        error
                    );


                    showMessage(
                        "Unable to connect to the server.",
                        "error"
                    );


                    resendButton.disabled =
                        false;

                }
                finally {

                    resendButton.textContent =
                        "Resend OTP";

                }

            }
        );

    </script>


</body>

</html>
