<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Inter, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(5,15,25,.88),
                    rgba(5,15,25,.95)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center/cover no-repeat;
        }

        .card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 45px;

            border-radius: 24px;

            box-shadow: 0 25px 60px rgba(0,0,0,.45);
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #f0fdf4;

            border: 2px solid #22c55e;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {

            text-align: center;

            font-size: 29px;

            color: #0f172a;

            margin-bottom: 10px;
        }

        h1 span {
            color: #22c55e;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #334155;

            margin-bottom: 8px;
        }

        .group {

            margin-bottom: 20px;
        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;
        }

        input:focus {

            border-color: #22c55e;

            box-shadow: 0 0 0 3px rgba(34,197,94,.12);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #22c55e;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            🔒
        </div>

        <h1>
            <span>Reset</span> Password
        </h1>

        <p class="subtitle">
            Create a new password for your administrator account.
        </p>


        <form id="resetForm">

            <div class="group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="6"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <div class="group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    placeholder="Confirm new password"
                    required
                >

            </div>


            <button type="submit">
                Reset Password →
            </button>

        </form>

    </div>


    <script>

        document
            .getElementById("resetForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const password =
                    document.getElementById("newPassword").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                if (password !== confirmPassword) {

                    alert("Passwords do not match.");

                    return;
                }

                alert("Password reset successfully!");

                window.location.href = "admin-login.html";

            });

    </script>

</body>

</html>
