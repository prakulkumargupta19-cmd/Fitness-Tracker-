<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Fitness Performance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#62bbe8',
                            hover: '#4ea8d5',
                            light: '#f0f9ff'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="../css/reset-password.css">

</head>


<body
    class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans relative overflow-x-hidden"
>


<div class="w-full max-w-lg bg-white rounded-3xl shadow-2xl p-8 sm:p-12 relative z-10">


    <!-- Icon -->

    <div
        class="w-16 h-16 mx-auto rounded-full bg-brand-light border-2 border-brand/40 flex items-center justify-center text-3xl"
    >

        🔑

    </div>


    <!-- Heading -->

    <div class="text-center mt-5">

        <h1 class="text-3xl font-black text-slate-900">

            Reset <span class="text-brand">Password</span>

        </h1>


        <p class="text-sm text-slate-500 mt-3">

            Create a new password for your coach account.

        </p>

    </div>


    <!-- Reset Form -->

    <form id="resetForm" class="mt-8 space-y-5">


        <!-- New Password -->

        <div>

            <label
                for="password"
                class="block text-xs font-bold text-slate-800 mb-2"
            >

                New Password

            </label>


            <div class="relative">

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    required
                    placeholder="Enter new password"
                    class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-lg outline-none focus:border-brand focus:ring-1 focus:ring-brand"
                >


                <button
                    type="button"
                    id="togglePassword"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand cursor-pointer"
                    aria-label="Show password"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                </button>

            </div>

        </div>


        <!-- Confirm Password -->

        <div>

            <label
                for="confirmPassword"
                class="block text-xs font-bold text-slate-800 mb-2"
            >

                Confirm New Password

            </label>


            <div class="relative">

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    placeholder="Confirm new password"
                    class="w-full px-4 py-3 pr-12 border border-slate-200 rounded-lg outline-none focus:border-brand focus:ring-1 focus:ring-brand"
                >


                <button
                    type="button"
                    id="toggleConfirm"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand cursor-pointer"
                    aria-label="Show password"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                </button>

            </div>

        </div>


        <!-- Message -->

        <div
            id="message"
            class="hidden rounded-lg p-3 text-xs"
        ></div>


        <!-- Reset Button -->

        <button
            type="submit"
            id="resetButton"
            class="w-full py-3.5 bg-brand hover:bg-brand-hover text-white font-bold rounded-xl transition shadow-lg shadow-brand/20 cursor-pointer"
        >

            Reset Password →

        </button>

    </form>


    <!-- Back to Login -->

    <a
        href="coach-login.html"
        class="block text-center mt-6 text-sm text-slate-500 hover:text-brand"
    >

        ← Back to Coach Login

    </a>


    <!-- Security Note -->

    <div
        class="border-t border-slate-100 mt-7 pt-5 text-center text-xs text-slate-400"
    >

        🔒 Your password is securely protected.

    </div>

</div>



<script>

/* =========================================================
   API
========================================================= */

const API_BASE = window.location.origin;


/* =========================================================
   PASSWORD VISIBILITY TOGGLE
========================================================= */

function setupPasswordToggle(buttonId, inputId) {

    const button =
        document.getElementById(buttonId);

    const input =
        document.getElementById(inputId);


    button.addEventListener("click", function () {

        if (input.type === "password") {

            input.type = "text";

            button.setAttribute(
                "aria-label",
                "Hide password"
            );

            button.innerHTML = `
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>

                    <line
                        x1="1"
                        y1="1"
                        x2="23"
                        y2="23"
                    ></line>
                </svg>
            `;

        } else {

            input.type = "password";

            button.setAttribute(
                "aria-label",
                "Show password"
            );

            button.innerHTML = `
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>

                    <circle
                        cx="12"
                        cy="12"
                        r="3"
                    ></circle>
                </svg>
            `;

        }

    });

}


setupPasswordToggle(
    "togglePassword",
    "password"
);


setupPasswordToggle(
    "toggleConfirm",
    "confirmPassword"
);



/* =========================================================
   MESSAGE HELPER
========================================================= */

function showMessage(text, type = "error") {

    const message =
        document.getElementById("message");


    if (type === "success") {

        message.className =
            "rounded-lg p-3 text-xs bg-sky-50 border border-sky-200 text-sky-700";

    } else {

        message.className =
            "rounded-lg p-3 text-xs bg-red-50 border border-red-200 text-red-600";

    }


    message.textContent = text;

}



/* =========================================================
   RESET PASSWORD
========================================================= */

document
    .getElementById("resetForm")
    .addEventListener("submit", async function (event) {

        event.preventDefault();


        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const button =
            document.getElementById("resetButton");


        /*
         * Email is saved by forgot-password.html
         */

        const email =
            sessionStorage.getItem("resetEmail");


        /*
         * OTP must have been successfully verified
         */

        const otpVerified =
            sessionStorage.getItem("otpVerified");


        /* -------------------------------------------------
           Check email
        ------------------------------------------------- */

        if (!email) {

            showMessage(
                "Reset session expired. Please request a new password reset."
            );

            return;

        }


        /* -------------------------------------------------
           Check OTP verification
        ------------------------------------------------- */

        if (otpVerified !== "true") {

            showMessage(
                "Please verify the OTP before resetting your password."
            );

            return;

        }


        /* -------------------------------------------------
           Validate password
        ------------------------------------------------- */

        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters."
            );

            return;

        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match."
            );

            return;

        }


        /* -------------------------------------------------
           Disable button
        ------------------------------------------------- */

        button.disabled = true;

        button.textContent =
            "Resetting Password...";


        try {

            const response =
                await fetch(
                    `${API_BASE}/api/reset-password`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            email: email,

                            password: password,

                            confirm_password:
                                confirmPassword

                        })
                    }
                );


            const data =
                await response.json().catch(
                    () => ({})
                );


            /* -------------------------------------------------
               Backend error
            ------------------------------------------------- */

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    data.message ||
                    "Unable to reset password."
                );

            }


            /* -------------------------------------------------
               Success
            ------------------------------------------------- */

            showMessage(
                data.message ||
                "Password reset successfully! Redirecting to login...",
                "success"
            );


            /*
             * Clear password-reset session data.
             */

            sessionStorage.removeItem(
                "resetEmail"
            );

            sessionStorage.removeItem(
                "otpVerified"
            );


            /*
             * Redirect to coach login.
             */

            setTimeout(function () {

                window.location.href =
                    "coach-login.html";

            }, 1200);


        } catch (error) {

            console.error(
                "Password reset error:",
                error
            );


            showMessage(
                error.message ||
                "Something went wrong. Please try again."
            );


            button.disabled = false;

            button.textContent =
                "Reset Password →";

        }

    });

</script>

</body>

</html>
