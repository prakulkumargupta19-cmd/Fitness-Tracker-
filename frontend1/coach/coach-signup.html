<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coach Create Account | Fitness Performance Tracker</title>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },

                    colors: {
                        brand: {
                            DEFAULT: '#62bbe8',
                            hover: '#4ea8d5',
                            light: '#f0f9ff',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Coach Signup CSS -->
    <link rel="stylesheet" href="../css/coach/coach-signup.css">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
    <link rel="stylesheet" href="../demo/auth.css">
    <link rel="stylesheet" href="../css/coach/coach-portal.css?v=6">
</head>


<body data-portal-role="coach">


    <main class="auth">
        <section class="art">
            <div class="copy">
                <h2>Empower<br>Athletes.<br><span class="accent">Build<br>Better<br>Performance.</span></h2>
                <div class="bar"></div>
                <p>Manage training plans, monitor progress, provide feedback, and help athletes achieve their goals.</p>
            </div>
        </section>


        <!-- =================================
             RIGHT COLUMN
        ================================== -->

        <section class="panel coach-signup-panel">

            <div class="coach-signup-content">


                <!-- TITLE -->

                <div class="text-center mb-6">

                    <h2
                        class="text-2xl font-black text-slate-900 tracking-tight"
                    >

                        <span class="text-brand">
                            Coach
                        </span>

                        Create Account

                    </h2>


                    <p class="text-xs text-slate-500 mt-1">

                        Create your coach account to manage
                        athlete performance and feedback.

                    </p>

                </div>


                <!-- REGISTRATION FORM -->

                <form
                    id="signupForm"
                    class="space-y-4"
                >


                    <!-- FULL NAME -->

                    <div>

                        <label
                            for="fullName"
                            class="block text-xs font-bold text-slate-800 mb-1"
                        >
                            Full Name
                        </label>

                        <div class="relative">

                            <input
                                type="text"
                                id="fullName"
                                required
                                placeholder="Enter your full name"
                                autocomplete="name"
                                class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-slate-400 transition-all"
                            >

                            <span class="absolute right-3.5 top-2.5 text-slate-400">

                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                                    />

                                </svg>

                            </span>

                        </div>

                    </div>

                    <!-- CONTACT NUMBER -->

                    <div>

                        <label
                            for="contactNumber"
                            class="block text-xs font-bold text-slate-800 mb-1"
                        >
                            Contact Number
                        </label>

                        <div class="relative">

                            <input
                                type="tel"
                                id="contactNumber"
                                required
                                placeholder="Enter your contact number"
                                class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-slate-400 transition-all"
                            >

                            <span class="absolute right-3.5 top-2.5 text-slate-400">

                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
                                    />
                                </svg>

                            </span>

                        </div>

                    </div>



                    <!-- COACH EMAIL -->

                    <div>

                        <label
                            for="coachEmail"
                            class="block text-xs font-bold text-slate-800 mb-1"
                        >
                            Coach Email
                        </label>

                        <div class="relative">

                            <input
                                type="email"
                                id="coachEmail"
                                required
                                placeholder="Enter your coach email"
                                autocomplete="email"
                                class="w-full px-3.5 py-2.5 text-xs text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-slate-400 transition-all"
                            >

                            <span class="absolute right-3.5 top-2.5 text-slate-400">

                                <svg
                                    class="w-4 h-4"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >

                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
                                    />

                                </svg>

                            </span>

                        </div>

                    </div>


                    <!-- PASSWORD -->

                    <div>

                        <label
                            for="password"
                            class="block text-xs font-bold text-slate-800 mb-1"
                        >
                            Password
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="password"
                                required
                                minlength="6"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                class="w-full px-3.5 py-2.5 pr-10 text-xs text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-slate-400 transition-all"
                            >

                            <button
                                type="button"
                                id="togglePassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand cursor-pointer"
                                aria-label="Show password"
                            >

                                <svg
                                    id="passwordEye"
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="w-4 h-4"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div>

                        <label
                            for="confirmPassword"
                            class="block text-xs font-bold text-slate-800 mb-1"
                        >
                            Confirm Password
                        </label>

                        <div class="relative">

                            <input
                                type="password"
                                id="confirmPassword"
                                required
                                minlength="6"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                class="w-full px-3.5 py-2.5 pr-10 text-xs text-slate-800 bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand placeholder-slate-400 transition-all"
                            >

                            <button
                                type="button"
                                id="toggleConfirmPassword"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-brand cursor-pointer"
                                aria-label="Show confirm password"
                            >

                                <svg
                                    id="confirmPasswordEye"
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="w-4 h-4"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >

                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>

                                </svg>

                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <div class="flex items-center text-xs py-1">

                        <label
                            class="flex items-center text-slate-600 cursor-pointer"
                        >

                            <input
                                type="checkbox"
                                id="terms"
                                required
                                class="w-3.5 h-3.5 rounded border-slate-300 text-brand focus:ring-0"
                            >

                            <span class="ml-2">

                                I agree to the

                                <a
                                    href="#"
                                    class="text-brand font-semibold hover:underline"
                                >
                                    Terms & Privacy Policy
                                </a>

                            </span>

                        </label>

                    </div>


                    <!-- ERROR -->

                    <div
                        id="errorMessage"
                        class="hidden bg-red-50 border border-red-200 text-red-600 rounded-lg px-3 py-2 text-xs"
                    ></div>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="signupButton"
                        class="w-full py-3 bg-brand hover:bg-brand-hover text-white font-bold text-xs rounded-xl shadow-lg shadow-brand/20 transition-all flex items-center justify-center gap-2 cursor-pointer"
                    >

                        <span id="buttonText">
                            Create Account
                        </span>

                        <span>
                            &rarr;
                        </span>

                    </button>

                </form>


                <!-- NAVIGATION -->

                <div class="mt-5 text-center space-y-2 text-xs">

                    <p class="text-slate-500">

                        Already have an account?

                        <a
                            href="coach-login.html"
                            class="text-brand font-bold hover:underline"
                        >
                            Sign In
                        </a>

                    </p>


                    <p>

                        <a
                            href="../mainlading.html"
                            class="text-slate-400 hover:text-slate-600 font-medium text-[11px]"
                        >
                            &larr; Back to role selection
                        </a>

                    </p>

                </div>

            </div>


        </section>

    </main>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        /* =================================
           PASSWORD VISIBILITY
        ================================== */

        const passwordInput =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");

        const passwordEye =
            document.getElementById("passwordEye");


        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.setAttribute(
                    "aria-label",
                    "Hide password"
                );

                passwordEye.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;

            } else {

                passwordInput.type = "password";

                togglePassword.setAttribute(
                    "aria-label",
                    "Show password"
                );

                passwordEye.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;

            }

        });


        /* =================================
           CONFIRM PASSWORD VISIBILITY
        ================================== */

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const toggleConfirmPassword =
            document.getElementById("toggleConfirmPassword");

        const confirmPasswordEye =
            document.getElementById("confirmPasswordEye");


        toggleConfirmPassword.addEventListener("click", function () {

            if (confirmPasswordInput.type === "password") {

                confirmPasswordInput.type = "text";

                toggleConfirmPassword.setAttribute(
                    "aria-label",
                    "Hide confirm password"
                );

                confirmPasswordEye.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;

            } else {

                confirmPasswordInput.type = "password";

                toggleConfirmPassword.setAttribute(
                    "aria-label",
                    "Show confirm password"
                );

                confirmPasswordEye.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;

            }

        });


        /* =================================
           FORM SUBMISSION
        ================================== */

        const signupForm =
            document.getElementById("signupForm");

        const signupButton =
            document.getElementById("signupButton");

        const buttonText =
            document.getElementById("buttonText");

        const errorMessage =
            document.getElementById("errorMessage");


        signupForm.addEventListener("submit", function (event) {

            event.preventDefault();


            /* GET VALUES */

            const fullName =
                document
                    .getElementById("fullName")
                    .value
                    .trim();

            const contactNumber =
                document
                    .getElementById("contactNumber")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("coachEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            const terms =
                document.getElementById("terms").checked;


            /* CLEAR ERROR */

            errorMessage.classList.add("hidden");
            errorMessage.textContent = "";


            /* VALIDATE NAME */

            if (!fullName) {

                errorMessage.textContent =
                    "Please enter your full name.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* VALIDATE CONTACT NUMBER */

            if (!contactNumber) {

                errorMessage.textContent =
                    "Please enter your contact number.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* VALIDATE EMAIL */

            if (!email) {

                errorMessage.textContent =
                    "Please enter your email address.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* VALIDATE PASSWORD */

            if (password.length < 6) {

                errorMessage.textContent =
                    "Password must contain at least 6 characters.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* VALIDATE PASSWORD MATCH */

            if (password !== confirmPassword) {

                errorMessage.textContent =
                    "Passwords do not match.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* VALIDATE TERMS */

            if (!terms) {

                errorMessage.textContent =
                    "Please agree to the Terms & Privacy Policy.";

                errorMessage.classList.remove("hidden");

                return;
            }


            /* LOADING STATE */

            signupButton.disabled = true;

            signupButton.classList.add(
                "opacity-70",
                "cursor-not-allowed"
            );

            buttonText.textContent =
                "Creating Account...";


            /* =================================
               BACKEND REGISTRATION
            ================================== */

                fetch(`${window.FITNESS_API_BASE || ""}/api/signup`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    name: fullName,
                    email: email,
                    contact_number: contactNumber,
                    password: password,
                    confirm_password: confirmPassword,
                    role: "coach"
                })

            })

            .then(async response => {

                const data =
                    await response
                        .json()
                        .catch(() => ({
                            message: "Unexpected server response."
                        }));

                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Unable to create coach account."
                    );

                }

                sessionStorage.setItem("authEmail", email);

                window.location.href =
                    "coach-signup-verify.html";

            })

            .catch(error => {

                console.error(
                    "Coach signup error:",
                    error
                );

                errorMessage.textContent =
                    error.message ||
                    "Unable to create account. Please try again.";

                errorMessage.classList.remove("hidden");

                signupButton.disabled = false;

                signupButton.classList.remove(
                    "opacity-70",
                    "cursor-not-allowed"
                );

                buttonText.textContent =
                    "Create Account";

            });

        });

    </script>

</body>

</html>
