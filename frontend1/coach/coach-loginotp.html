<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Coach OTP Verification | Fitness Performance Tracker</title>


    <!-- =========================================================
         GOOGLE FONT
    ========================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link

        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =========================================================
         SHARED CSS
    ========================================================== -->

    <link
        rel="stylesheet"
    >


    <!-- =========================================================
         COACH OTP CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="../css/coach/coach-verify.css"
    >

    <link
        rel="stylesheet"
        href="../css/common/verification-portal.css"
    >

<script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
</head>


<body>


    <!-- =========================================================
         OTP CARD
    ========================================================== -->

    <div class="otp-card">


        <!-- =====================================================
             ICON
        ====================================================== -->

        <div class="otp-icon">
            🔐
        </div>


        <!-- =====================================================
             HEADING
        ====================================================== -->

        <h1>
            Coach <span>Verification</span>
        </h1>


        <p class="description">
            Enter the 6-digit verification code
            sent to your registered email address.
        </p>


        <!-- =====================================================
             EMAIL
        ====================================================== -->

        <div class="email-display">

            OTP sent to:

            <strong id="userEmail">
                No email selected
            </strong>

        </div>


        <!-- =====================================================
             OTP INPUTS
        ====================================================== -->

        <div class="otp-container">

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
                autocomplete="one-time-code"
                autofocus
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

            <input
                type="text"
                class="otp-input"
                maxlength="1"
                inputmode="numeric"
            >

        </div>


        <!-- =====================================================
             VERIFY BUTTON
        ====================================================== -->

        <button
            type="button"
            class="verify-button"
            id="verifyButton"
        >
            Verify &amp; Login
        </button>


        <!-- =====================================================
             TIMER
        ====================================================== -->

        <div class="timer">

            OTP expires in:

            <span id="timer">
                02:00
            </span>

        </div>


        <!-- =====================================================
             RESEND
        ====================================================== -->

        <div class="resend">

            Didn't receive the code?

            <button
                type="button"
                id="resendButton"
                disabled
            >
                Resend OTP
            </button>

        </div>


        <!-- =====================================================
             MESSAGE
        ====================================================== -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- =====================================================
             BACK TO LOGIN
        ====================================================== -->

        <a
            href="coach-login.html"
            class="change-email"
        >
            ← Back to Coach Login
        </a>


        <!-- =====================================================
             SECURITY
        ====================================================== -->

        <div class="security-note">

            🔒 Never share your OTP with anyone.
            Our team will never ask you for your OTP.

        </div>

    </div>


<script>

"use strict";


/* =========================================================
   API BASE
========================================================= */

const API_BASE = window.FITNESS_API_BASE || "";


/* =========================================================
   BACKEND ENDPOINTS
=========================================================

   IMPORTANT:
   Your coach-login.html shows the login endpoint:

       /api/login

   It does NOT show the OTP verification/resend routes.

   The routes below assume your Flask backend uses:

       /api/login/verify-otp
       /api/login/resend-otp

   If your backend uses different routes, change only
   these two constants.
========================================================= */

const VERIFY_OTP_ENDPOINT =
    "/api/login/verify-otp";

const RESEND_OTP_ENDPOINT =
    "/api/login/resend-otp";


/* =========================================================
   ELEMENTS
========================================================= */

const otpInputs =
    document.querySelectorAll(".otp-input");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

const message =
    document.getElementById("message");

const timerElement =
    document.getElementById("timer");

const userEmail =
    document.getElementById("userEmail");


/* =========================================================
   GET COACH LOGIN EMAIL
=========================================================

   coach-login.html stores:

       sessionStorage.setItem(
           "loginOtpEmail",
           email
       );

   Therefore this page must read the exact same key.
========================================================= */

const email =
    (
        sessionStorage.getItem("loginOtpEmail") ||
        ""
    )
    .trim()
    .toLowerCase();


/* =========================================================
   CHECK EMAIL
========================================================= */

if (email) {

    userEmail.textContent =
        email;

} else {

    userEmail.textContent =
        "No email selected";

    verifyButton.disabled =
        true;

    showMessage(
        "No coach login request was found. Please return to the coach login page.",
        "error"
    );

}


/* =========================================================
   SHOW MESSAGE
========================================================= */

function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


/* =========================================================
   GET OTP
========================================================= */

function getOTP() {

    let otp = "";

    otpInputs.forEach(function (input) {

        otp += input.value;

    });

    return otp;

}


/* =========================================================
   OTP INPUT BEHAVIOR
========================================================= */

otpInputs.forEach(function (input, index) {


    /* -----------------------------------------------------
       Enter digit
    ------------------------------------------------------ */

    input.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 1);


            if (
                this.value &&
                index < otpInputs.length - 1
            ) {

                otpInputs[index + 1].focus();

            }

        }
    );


    /* -----------------------------------------------------
       Keyboard navigation
    ------------------------------------------------------ */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Backspace" &&
                !this.value &&
                index > 0
            ) {

                otpInputs[index - 1].focus();

            }


            if (
                event.key === "ArrowLeft" &&
                index > 0
            ) {

                otpInputs[index - 1].focus();

            }


            if (
                event.key === "ArrowRight" &&
                index < otpInputs.length - 1
            ) {

                otpInputs[index + 1].focus();

            }

        }
    );


    /* -----------------------------------------------------
       Paste complete OTP
    ------------------------------------------------------ */

    input.addEventListener(
        "paste",
        function (event) {

            event.preventDefault();


            const pastedData =
                event.clipboardData
                    .getData("text")
                    .replace(/\D/g, "")
                    .slice(0, 6);


            pastedData
                .split("")
                .forEach(function (digit, i) {

                    if (otpInputs[i]) {

                        otpInputs[i].value =
                            digit;

                    }

                });


            if (pastedData.length === 6) {

                otpInputs[5].focus();

            }

        }
    );

});


/* =========================================================
   VERIFY OTP
========================================================= */

verifyButton.addEventListener(
    "click",
    async function () {


        const otp =
            getOTP();


        /* -------------------------------------------------
           Validate OTP
        -------------------------------------------------- */

        if (otp.length !== 6) {

            showMessage(
                "Please enter the complete 6-digit OTP.",
                "error"
            );

            return;

        }


        /* -------------------------------------------------
           Validate email
        -------------------------------------------------- */

        if (!email) {

            showMessage(
                "No coach login request was found. Please return to the coach login page.",
                "error"
            );

            return;

        }


        /* -------------------------------------------------
           Disable button
        -------------------------------------------------- */

        verifyButton.disabled =
            true;

        verifyButton.textContent =
            "Verifying...";

        message.className =
            "message";


        try {


            /* =============================================
               SEND OTP TO FLASK
            ============================================== */

            const response =
                await fetch(
                    `${API_BASE}${VERIFY_OTP_ENDPOINT}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            email: email,

                            otp: otp,

                            role: "coach"

                        })

                    }
                );


            /* =============================================
               READ RESPONSE
            ============================================== */

            const data =
                await response
                    .json()
                    .catch(function () {

                        return {};

                    });


            console.log(
                "COACH OTP RESPONSE:",
                response.status,
                data
            );


            /* =============================================
               BACKEND REJECTED OTP
            ============================================== */

            if (!response.ok || data.success === false) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Invalid or expired OTP."
                );

            }


            /* =============================================
               OTP SUCCESS
            ============================================== */

            showMessage(
                data.message ||
                "OTP verified successfully. Logging you in...",
                "success"
            );


            /* =============================================
               OPTIONAL COACH INFORMATION
            ============================================== */

            if (data.user) {

                if (data.user.name) {

                    sessionStorage.setItem(
                        "coachName",
                        data.user.name
                    );

                }

                if (data.user.id) {

                    sessionStorage.setItem(
                        "coachId",
                        String(data.user.id)
                    );

                }

            }


            /* =============================================
               MARK LOGIN OTP AS VERIFIED
            ============================================== */

            sessionStorage.setItem(
                "coachOtpVerified",
                "true"
            );


            /* =============================================
               REDIRECT TO COACH DASHBOARD
            ============================================== */

            setTimeout(
                function () {

                    window.location.assign(
                        "coach-dashboard.html"
                    );

                },
                700
            );


        } catch (error) {


            console.error(
                "Coach OTP verification error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to verify OTP. Please try again.",
                "error"
            );


            verifyButton.disabled =
                false;

            verifyButton.textContent =
                "Verify & Login";

        }

    }
);


/* =========================================================
   COUNTDOWN TIMER
========================================================= */

let timeLeft = 120;

let countdown;


function startTimer() {

    clearInterval(countdown);

    timeLeft = 120;

    resendButton.disabled =
        true;

    resendButton.textContent =
        "Resend OTP";

    timerElement.textContent =
        "02:00";


    countdown =
        setInterval(
            function () {


                const minutes =
                    Math.floor(timeLeft / 60);


                const seconds =
                    timeLeft % 60;


                timerElement.textContent =
                    String(minutes).padStart(2, "0")
                    + ":"
                    + String(seconds).padStart(2, "0");


                if (timeLeft <= 0) {

                    clearInterval(countdown);

                    timerElement.textContent =
                        "Expired";

                    resendButton.disabled =
                        false;

                    return;

                }


                timeLeft--;

            },
            1000
        );

}


/* =========================================================
   START TIMER
========================================================= */

startTimer();


/* =========================================================
   RESEND OTP
========================================================= */

resendButton.addEventListener(
    "click",
    async function () {


        if (!email) {

            showMessage(
                "No coach login request was found. Please return to the coach login page.",
                "error"
            );

            return;

        }


        resendButton.disabled =
            true;

        resendButton.textContent =
            "Sending...";


        try {


            /* =============================================
               RESEND OTP
            ============================================== */

            const response =
                await fetch(
                    `${API_BASE}${RESEND_OTP_ENDPOINT}`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials: "include",

                        body: JSON.stringify({

                            email: email,

                            role: "coach"

                        })

                    }
                );


            /* =============================================
               READ RESPONSE
            ============================================== */

            const data =
                await response
                    .json()
                    .catch(function () {

                        return {};

                    });


            console.log(
                "COACH OTP RESEND RESPONSE:",
                response.status,
                data
            );


            /* =============================================
               SERVER ERROR
            ============================================== */

            if (!response.ok || data.success === false) {

                throw new Error(
                    data.message ||
                    data.error ||
                    "Unable to resend OTP."
                );

            }


            /* =============================================
               SUCCESS
            ============================================== */

            showMessage(
                data.message ||
                "A new OTP has been sent to your email.",
                "success"
            );


            /* =============================================
               RESTART TIMER
            ============================================== */

            startTimer();


        } catch (error) {


            console.error(
                "Coach OTP resend error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to resend OTP. Please try again.",
                "error"
            );


            resendButton.disabled =
                false;

            resendButton.textContent =
                "Resend OTP";

        }

    }
);

</script>

</body>

</html>
