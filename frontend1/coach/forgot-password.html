<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Fitness Performance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#62bbe8',
                            hover: '#4ea8d5',
                            light: '#f0f9ff'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="../css/coach-forgot-password.css">

</head>


<body class="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans relative overflow-x-hidden">

    <div class="forgot-password-card">

        <!-- Icon -->
        <div class="forgot-icon">
            🔐
        </div>


        <!-- Heading -->
        <div class="forgot-header">

            <h1>
                Forgot <span>Password?</span>
            </h1>

            <p>
                Enter your registered coach email address.
                We'll send you a verification code to reset your password.
            </p>

        </div>


        <!-- Form -->
        <form id="emailForm" class="forgot-form">

            <label for="email">
                Coach Email
            </label>


            <input
                type="email"
                id="email"
                required
                autocomplete="email"
                placeholder="Enter your coach email"
            >


            <div
                id="message"
                class="message hidden">
            </div>


            <button
                type="submit"
                id="sendButton">

                Send Verification Code →

            </button>

        </form>


        <!-- Back to login -->
        <a
            href="coach-login.html"
            class="back-login">

            ← Back to Coach Login

        </a>


        <!-- Security note -->
        <div class="security-note">

            🔒 Your account information is securely protected.

        </div>

    </div>


<script>

/* =========================================================
   API
========================================================= */

const API_BASE = window.location.origin;


/* =========================================================
   ELEMENTS
========================================================= */

const emailForm = document.getElementById("emailForm");
const emailInput = document.getElementById("email");
const sendButton = document.getElementById("sendButton");
const message = document.getElementById("message");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type = "error") {

    message.textContent = text;

    message.classList.remove(
        "hidden",
        "message-success",
        "message-error"
    );

    if (type === "success") {
        message.classList.add("message-success");
    } else {
        message.classList.add("message-error");
    }

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

emailForm.addEventListener("submit", async function (event) {

    event.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
        showMessage("Please enter your coach email address.");
        return;
    }


    /* Disable button */

    sendButton.disabled = true;
    sendButton.textContent = "Sending Code...";

    message.classList.add("hidden");


    try {

        const response = await fetch(
            `${API_BASE}/api/forgot-password`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: email
                })
            }
        );


        const data = await response.json().catch(() => ({}));


        /* Backend error */

        if (!response.ok) {

            throw new Error(
                data.message ||
                data.error ||
                "Unable to send verification code."
            );

        }


        /* Save email temporarily for OTP page */

        sessionStorage.setItem(
            "resetEmail",
            email
        );


        /* Show success */

        showMessage(
            data.message ||
            "Verification code sent to your email.",
            "success"
        );


        /*
         * Give the user a moment to see the
         * success message before moving to OTP page.
         */

        setTimeout(function () {

            window.location.href =
                "verify.html?email=" + encodeURIComponent(email);

        }, 1000);


    } catch (error) {

        console.error(
            "Forgot password error:",
            error
        );


        showMessage(
            error.message ||
            "Unable to connect to the server."
        );


        sendButton.disabled = false;

        sendButton.textContent =
            "Send Verification Code →";

    }

});

</script>

</body>
</html>
