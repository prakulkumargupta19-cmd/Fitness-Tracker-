<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Create Account | Athlete Tracker</title>

    <!-- Shared CSS -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="../css/admin-signup.css">

</head>

<body>

<div class="card">

    <div class="logo">
        ⚙
    </div>

    <h1>
        <span>Admin</span>
        Create Account
    </h1>

    <p class="subtitle">
        Create your administrator account.
        A verification OTP will be sent to your email.
    </p>

    <form
        id="signupForm"
        novalidate
    >

        <!-- FULL NAME -->

        <div class="field">

            <label for="fullName">
                Full Name
            </label>

            <input
                id="fullName"
                type="text"
                placeholder="Enter your full name"
                autocomplete="name"
            >

        </div>


        <!-- EMAIL -->

        <div class="field">

            <label for="adminEmail">
                Admin Email
            </label>

            <input
                id="adminEmail"
                type="email"
                placeholder="Enter your admin email"
                autocomplete="email"
            >

        </div>


        <!-- PASSWORD -->

        <div class="field">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    id="password"
                    type="password"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="eye"
                    id="togglePassword"
                    aria-label="Toggle password visibility"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                </button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="field">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="password-box">

                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                >

                <button
                    type="button"
                    class="eye"
                    id="toggleConfirmPassword"
                    aria-label="Toggle confirm password visibility"
                >

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path
                            d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                        ></path>

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        ></circle>

                    </svg>

                </button>

            </div>

        </div>


        <!-- TERMS -->

        <label class="terms">

            <input
                id="terms"
                type="checkbox"
            >

            <span>
                I agree to the Terms & Privacy Policy.
            </span>

        </label>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- CREATE ACCOUNT -->

        <button
            type="button"
            id="signupButton"
        >

            <span id="buttonText">
                Create Account
            </span>

        </button>

    </form>


    <!-- LOGIN -->

    <div class="login">

        Already have an account?

        <a href="admin-login.html">
            Sign In
        </a>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   API
========================================================= */

const API =
    window.location.origin;


/* =========================================================
   ELEMENTS
========================================================= */

const signupButton =
    document.getElementById(
        "signupButton"
    );

const buttonText =
    document.getElementById(
        "buttonText"
    );

const message =
    document.getElementById(
        "message"
    );


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
) {

    message.textContent =
        text;

    message.className =
        "message " + type;

}


function clearMessage() {

    message.textContent =
        "";

    message.className =
        "message";

}


/* =========================================================
   PASSWORD VISIBILITY
========================================================= */

function setEyeIcon(
    button,
    visible
) {

    if (visible) {

        button.innerHTML = `
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                ></path>

                <path
                    d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                ></path>

                <path
                    d="M14.12 14.12a3 3 0 1 1-4.24-4.24"
                ></path>

                <line
                    x1="1"
                    y1="1"
                    x2="23"
                    y2="23"
                ></line>

            </svg>
        `;

    } else {

        button.innerHTML = `
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                ></path>

                <circle
                    cx="12"
                    cy="12"
                    r="3"
                ></circle>

            </svg>
        `;

    }

}


/* =========================================================
   PASSWORD TOGGLE
========================================================= */

document
    .getElementById("togglePassword")
    .addEventListener(
        "click",
        function () {

            const input =
                document.getElementById(
                    "password"
                );

            const visible =
                input.type === "password";

            input.type =
                visible
                    ? "text"
                    : "password";

            setEyeIcon(
                this,
                visible
            );

        }
    );


/* =========================================================
   CONFIRM PASSWORD TOGGLE
========================================================= */

document
    .getElementById("toggleConfirmPassword")
    .addEventListener(
        "click",
        function () {

            const input =
                document.getElementById(
                    "confirmPassword"
                );

            const visible =
                input.type === "password";

            input.type =
                visible
                    ? "text"
                    : "password";

            setEyeIcon(
                this,
                visible
            );

        }
    );


/* =========================================================
   CREATE ACCOUNT
========================================================= */

signupButton.addEventListener(
    "click",
    async function () {

        clearMessage();


        const name =
            document
                .getElementById("fullName")
                .value
                .trim();


        const email =
            document
                .getElementById("adminEmail")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        const terms =
            document
                .getElementById("terms")
                .checked;


        /* -----------------------------------------
           VALIDATION
        ----------------------------------------- */

        if (!name) {

            showMessage(
                "Please enter your full name.",
                "error"
            );

            return;

        }


        if (!email) {

            showMessage(
                "Please enter your email.",
                "error"
            );

            return;

        }


        if (!email.includes("@")) {

            showMessage(
                "Please enter a valid email address.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must contain at least 6 characters.",
                "error"
            );

            return;

        }


        if (password !== confirmPassword) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        if (!terms) {

            showMessage(
                "Please accept the Terms & Privacy Policy.",
                "error"
            );

            return;

        }


        /* -----------------------------------------
           DISABLE BUTTON
        ----------------------------------------- */

        signupButton.disabled =
            true;

        buttonText.textContent =
            "Sending OTP...";


        /* -----------------------------------------
           BACKEND REQUEST
        ----------------------------------------- */

        try {

            const response =
                await fetch(
                    API + "/api/admin-signup",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        credentials:
                            "include",

                        body:
                            JSON.stringify({
                                name:
                                    name,

                                email:
                                    email,

                                password:
                                    password
                            })
                    }
                );


            const result =
                await response.json();


            console.log(
                "ADMIN SIGNUP RESPONSE:",
                response.status,
                result
            );


            /* -----------------------------------------
               CHECK RESPONSE
            ----------------------------------------- */

            if (
                response.status !== 201 ||
                result.success !== true
            ) {

                throw new Error(
                    result.message ||
                    "Unable to send OTP."
                );

            }


            /* -----------------------------------------
               STORE TEMPORARY SIGNUP INFORMATION

               Password is NOT stored.
            ----------------------------------------- */

            sessionStorage.setItem(
                "adminSignupEmail",
                email
            );


            sessionStorage.setItem(
                "adminSignupName",
                name
            );


            /* -----------------------------------------
               SUCCESS
            ----------------------------------------- */

            showMessage(
                "OTP sent successfully. Redirecting...",
                "success"
            );


            /* -----------------------------------------
               REDIRECT TO OTP PAGE
            ----------------------------------------- */

            const verifyPage =
                new URL(
                    "admin-signup-verify.html",
                    window.location.href
                ).href;


            window.location.assign(
                verifyPage
            );

        }


        catch (error) {

            console.error(
                "ADMIN SIGNUP ERROR:",
                error
            );


            showMessage(
                error.message ||
                "Unable to connect to server.",
                "error"
            );


            signupButton.disabled =
                false;

            buttonText.textContent =
                "Create Account";

        }

    }
);

</script>

</body>

</html>
