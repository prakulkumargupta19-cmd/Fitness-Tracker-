<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            font-family: Inter, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    rgba(12, 25, 42, 0.88),
                    rgba(12, 25, 42, 0.94)
                ),
                url("https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=2000&q=80")
                center/cover no-repeat;
        }

        .card {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 45px;

            border-radius: 24px;

            box-shadow: 0 25px 60px rgba(0,0,0,.45);
        }

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 25px;

            border-radius: 50%;

            background: #f0f9ff;

            border: 2px solid #62bbe8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        h1 {

            text-align: center;

            font-size: 29px;

            color: #0f172a;

            margin-bottom: 10px;
        }

        h1 span {
            color: #62bbe8;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }

        label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #334155;

            margin-bottom: 8px;
        }

        .group {

            margin-bottom: 20px;
        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            outline: none;
        }

        input:focus {

            border-color: #62bbe8;

            box-shadow: 0 0 0 3px rgba(98, 187, 232, 0.18);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #62bbe8;

            color: white;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            box-shadow: 0 4px 14px rgba(98, 187, 232, 0.35);
        }

        button:hover {
            background: #4ea8d5;
        }

        button:disabled {
            background: #94a3b8;
            opacity: .7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {

            display: none;

            margin-bottom: 15px;

            padding: 11px;

            border-radius: 8px;

            font-size: 13px;
        }

        .message.error {
            display: block;

            background: #fff1f2;

            border: 1px solid #fecdd3;

            color: #be123c;
        }

        .message.success {
            display: block;

            background: #f0f9ff;

            border: 1px solid #bae6fd;

            color: #0369a1;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            font-size: 13px;

            text-decoration: none;
        }

        .back:hover {
            color: #62bbe8;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            <span>Forgot</span> Password
        </h1>

        <p class="subtitle">
            Enter your account email and we will send you
            a verification OTP to reset your password.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="forgotForm">

            <div class="group">

                <label for="email">
                    Account Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                id="sendButton"
            >
                Send OTP →
            </button>

        </form>


        <a
            href="admin-login.html"
            class="back"
        >
            ← Back to login
        </a>

    </div>


    <script>

        const API_URL =
            "http://127.0.0.1:5000";

        const form =
            document.getElementById("forgotForm");

        const message =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    message.textContent =
                        "Please enter your email.";

                    message.className =
                        "message error";

                    return;
                }


                message.className =
                    "message";

                sendButton.disabled =
                    true;

                sendButton.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            API_URL +
                            "/api/forgot-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        email: email
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        result.success !== true
                    ) {

                        throw new Error(
                            result.message ||
                            "Unable to send OTP."
                        );
                    }


                    /* Remember the email for the OTP page */

                    sessionStorage.setItem(
                        "resetEmail",
                        email
                    );

                    localStorage.setItem(
                        "resetEmail",
                        email
                    );


                    message.textContent =
                        "OTP sent. Redirecting...";

                    message.className =
                        "message success";


                    setTimeout(function() {

                        window.location.href =
                            "verify-otp.html?email=" +
                            encodeURIComponent(email);

                    }, 700);

                }

                catch (error) {

                    console.error(
                        "FORGOT PASSWORD ERROR:",
                        error
                    );

                    message.textContent =
                        error.message ||
                        "Unable to connect to the server.";

                    message.className =
                        "message error";

                    sendButton.disabled =
                        false;

                    sendButton.textContent =
                        "Send OTP →";

                }

            }
        );

    </script>

<script src="../js/auth-flow.js"></script>
</body>

</html>
