<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Admin</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/admin-forgot-password.css"
    >

<script src="../js/config.js"></script>
</head>

<body>

    <div class="card">

        <div class="icon">
            🔑
        </div>

        <h1>
            <span>Forgot</span> Password
        </h1>

        <p class="subtitle">
            Enter your account email and we will send you
            a verification OTP to reset your password.
        </p>

        <div
            id="message"
            class="message"
        ></div>

        <form id="forgotForm">

            <div class="group">

                <label for="email">
                    Account Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                id="sendButton"
            >
                Send OTP →
            </button>

        </form>

        <a
            href="admin-login.html"
            class="back"
        >
            ← Back to login
        </a>

    </div>


    <script>

        /*
         * Use the same origin as the frontend.
         */
        const API_URL = window.FITNESS_API_BASE || "";


        const form =
            document.getElementById("forgotForm");

        const message =
            document.getElementById("message");

        const sendButton =
            document.getElementById("sendButton");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim()
                        .toLowerCase();


                if (!email) {

                    message.textContent =
                        "Please enter your email.";

                    message.className =
                        "message error";

                    return;
                }


                message.textContent = "";

                message.className =
                    "message";


                sendButton.disabled = true;

                sendButton.textContent =
                    "Sending...";


                try {

                    const response =
                        await fetch(
                            API_URL +
                            "/api/forgot-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body:
                                    JSON.stringify({
                                        email: email
                                    })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        result.success !== true
                    ) {

                        throw new Error(
                            result.message ||
                            "Unable to send OTP."
                        );

                    }


                    /*
                     * Save the email for the OTP page.
                     */
                    sessionStorage.setItem(
                        "resetEmail",
                        email
                    );


                    message.textContent =
                        "OTP sent. Redirecting...";

                    message.className =
                        "message success";


                    /*
                     * Redirect to the admin OTP page.
                     */
                    setTimeout(
                        function() {

                            window.location.href =
                                "verify.html";

                        },
                        700
                    );

                }

                catch (error) {

                    console.error(
                        "ADMIN FORGOT PASSWORD ERROR:",
                        error
                    );


                    message.textContent =
                        error.message ||
                        "Unable to connect to the server.";

                    message.className =
                        "message error";


                    sendButton.disabled = false;

                    sendButton.textContent =
                        "Send OTP →";

                }

            }
        );

    </script>

</body>

</html>
