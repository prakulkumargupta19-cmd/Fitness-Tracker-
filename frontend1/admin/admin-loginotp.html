<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OTP Verification | Fitness Performance Tracker</title>

    <link rel="stylesheet" href="../css/admin/admin-loginotp.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="../js/config.js?v=admin-otp-api-2"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">

    <link rel="stylesheet" href="../css/admin/admin-loginotp-attributes.css" />
</head>

<body>

<div class="otp-page">

    <div class="otp-card">

        <div data-external-style-1>
            <img src="../logo.png" alt="Fit Track Logo" class="brand-logo" data-external-style-2>
        </div>

        <div class="otp-icon" aria-hidden="true">
            <i class="bi bi-shield-check"></i>
        </div>

        <h1>Verify Your Account</h1>

        <p class="otp-subtitle">
            Enter the 6-digit verification code sent to your
            administrator email address.
        </p>

        <div id="emailDisplay" class="email-display"></div>

        <form id="otpForm" novalidate>

            <label for="otp">Verification Code</label>

            <input
                type="text"
                id="otp"
                class="otp-input"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                maxlength="6"
                aria-label="6-digit verification code"
                required
            >

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                type="submit"
                id="verifyBtn"
                class="verify-btn"
            >
                <span id="verifyText">Verify OTP</span>
                <span id="verifySpinner" class="spinner" hidden></span>
            </button>

        </form>

        <div class="resend-section">
            <p>Didn't receive the code?</p>

            <button
                type="button"
                id="resendBtn"
                class="resend-btn"
            >
                Resend OTP
            </button>

            <div
                id="resendMessage"
                class="resend-message"
                aria-live="polite"
            ></div>
        </div>

        <a href="admin-login.html" class="back-link">
            ← Back to Admin Login
        </a>

        <div class="security-note">
            <span><i class="bi bi-shield-lock-fill"></i></span>
            <p>
                For your security, this verification code expires
                after a limited time.
            </p>
        </div>

    </div>

</div>

<script src="../js/admin/admin-loginotp-script-1.js"></script>

</body>
</html>
