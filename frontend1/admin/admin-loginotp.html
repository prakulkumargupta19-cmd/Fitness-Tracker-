<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin OTP Verification | Fitness Performance Tracker</title>

    <link rel="stylesheet" href="../css/admin-loginotp.css">
    <script src="../js/config.js?v=admin-otp-api-2"></script>
</head>

<body>

<div class="otp-page">

    <div class="otp-card">

        <div class="otp-icon" aria-hidden="true">
            <i>✓</i>
        </div>

        <h1>Verify Your Account</h1>

        <p class="otp-subtitle">
            Enter the 6-digit verification code sent to your
            administrator email address.
        </p>

        <div id="emailDisplay" class="email-display"></div>

        <form id="otpForm" novalidate>

            <label for="otp">Verification Code</label>

            <input
                type="text"
                id="otp"
                class="otp-input"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="000000"
                maxlength="6"
                aria-label="6-digit verification code"
                required
            >

            <div
                id="message"
                class="message"
                role="alert"
                aria-live="polite"
            ></div>

            <button
                type="submit"
                id="verifyBtn"
                class="verify-btn"
            >
                <span id="verifyText">Verify OTP</span>
                <span id="verifySpinner" class="spinner" hidden></span>
            </button>

        </form>

        <div class="resend-section">
            <p>Didn't receive the code?</p>

            <button
                type="button"
                id="resendBtn"
                class="resend-btn"
            >
                Resend OTP
            </button>

            <div
                id="resendMessage"
                class="resend-message"
                aria-live="polite"
            ></div>
        </div>

        <a href="admin-login.html" class="back-link">
            ← Back to Admin Login
        </a>

        <div class="security-note">
            <span>🔒</span>
            <p>
                For your security, this verification code expires
                after a limited time.
            </p>
        </div>

    </div>

</div>

<script>
"use strict";

(function () {

    const localHosts = ["localhost", "127.0.0.1", "::1", "[::1]"];
    const API_URL = window.FITNESS_API_BASE ||
        (localHosts.includes(window.location.hostname)
            ? "http://localhost:5000"
            : "");

    const otpForm = document.getElementById("otpForm");
    const otpInput = document.getElementById("otp");
    const verifyBtn = document.getElementById("verifyBtn");
    const verifyText = document.getElementById("verifyText");
    const verifySpinner = document.getElementById("verifySpinner");

    const resendBtn = document.getElementById("resendBtn");
    const resendMessage = document.getElementById("resendMessage");

    const message = document.getElementById("message");
    const emailDisplay = document.getElementById("emailDisplay");

    const adminEmail = (
        sessionStorage.getItem("adminLoginEmail") || ""
    ).trim().toLowerCase();

    let resendCooldown = null;
    let resendSeconds = 60;

    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + (type || "");
    }

    function clearMessage() {
        message.textContent = "";
        message.className = "message";
    }

    function maskEmail(email) {
        const parts = email.split("@");

        if (parts.length !== 2) {
            return email;
        }

        const name = parts[0];
        const domain = parts[1];

        if (name.length <= 2) {
            return name.charAt(0) + "***@" + domain;
        }

        return (
            name.charAt(0) +
            "***" +
            name.charAt(name.length - 1) +
            "@" +
            domain
        );
    }

    function startResendCooldown(seconds) {
        clearInterval(resendCooldown);

        resendSeconds = seconds;
        resendBtn.disabled = true;

        resendBtn.textContent =
            "Resend OTP (" + resendSeconds + "s)";

        resendCooldown = setInterval(function () {

            resendSeconds--;

            if (resendSeconds <= 0) {
                clearInterval(resendCooldown);
                resendCooldown = null;
                resendBtn.disabled = false;
                resendBtn.textContent = "Resend OTP";
                return;
            }

            resendBtn.textContent =
                "Resend OTP (" + resendSeconds + "s)";

        }, 1000);
    }

    if (!adminEmail) {
        showMessage(
            "Administrator email information is missing. Please log in again.",
            "error"
        );

        verifyBtn.disabled = true;
        resendBtn.disabled = true;

        return;
    }

    emailDisplay.textContent =
        "Code sent to " + maskEmail(adminEmail);

    otpInput.addEventListener("input", function () {
        otpInput.value = otpInput.value
            .replace(/\D/g, "")
            .slice(0, 6);
    });

    otpForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        clearMessage();

        const otp = otpInput.value.trim();

        if (!/^\d{6}$/.test(otp)) {
            showMessage(
                "Please enter the complete 6-digit OTP.",
                "error"
            );
            otpInput.focus();
            return;
        }

        verifyBtn.disabled = true;
        verifyText.textContent = "Verifying...";
        verifySpinner.hidden = false;

        try {

            const response = await fetch(
                API_URL + "/api/admin-login/verify-otp",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email: adminEmail,
                        otp: otp
                    })
                }
            );

            const data = await response.json().catch(function () {
                return {};
            });

            if (!response.ok || !data.success) {
                throw new Error(
                    data.message ||
                    "Invalid or expired OTP."
                );
            }

            showMessage(
                "OTP verified successfully. Opening Admin Dashboard...",
                "success"
            );

            sessionStorage.removeItem("adminLoginEmail");

            clearInterval(resendCooldown);

            setTimeout(function () {
                window.location.replace("admin-dashboard.html");
            }, 700);

        } catch (error) {

            showMessage(
                error.message ||
                "Unable to verify OTP. Please try again.",
                "error"
            );

            otpInput.value = "";
            otpInput.focus();

            verifyBtn.disabled = false;
            verifyText.textContent = "Verify OTP";
            verifySpinner.hidden = true;
        }

    });

    resendBtn.addEventListener("click", async function () {

        clearMessage();
        resendMessage.textContent = "";

        resendBtn.disabled = true;
        resendMessage.textContent = "Sending new OTP...";

        try {

            const response = await fetch(
                API_URL + "/api/admin-login/resend-otp",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({
                        email: adminEmail
                    })
                }
            );

            const data = await response.json().catch(function () {
                return {};
            });

            if (!response.ok || !data.success) {
                throw new Error(
                    data.message ||
                    "Unable to resend OTP."
                );
            }

            resendMessage.textContent =
                "A new OTP has been sent.";

            otpInput.value = "";
            otpInput.focus();

            startResendCooldown(60);

        } catch (error) {

            resendMessage.textContent =
                error.message ||
                "Unable to resend OTP.";

            resendBtn.disabled = false;
            resendBtn.textContent = "Resend OTP";
        }

    });

    otpInput.focus();
    startResendCooldown(60);

})();
</script>

</body>
</html>
