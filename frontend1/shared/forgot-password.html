<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Fitness Performance Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/student/shared-forgot.css">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
</head>
<body>
    <div class="card">
        <h1>Forgot <span>Password</span></h1>
        <p class="subtitle">Enter your registered email address to receive an OTP.</p>
        <div class="group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <button id="sendButton">Continue</button>
        <div id="message" class="message"></div>
    </div>
    <script>
        const API_URL = window.FITNESS_API_BASE || "";
        document.getElementById("sendButton").addEventListener("click", async () => {
            const email = document.getElementById("email").value.trim().toLowerCase();
            const message = document.getElementById("message");
            if (!email) {
                message.textContent = "Please enter your email.";
                message.className = "message error";
                return;
            }
            try {
                const response = await fetch(API_URL + "/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to send OTP.");
                sessionStorage.setItem("resetEmail", email);
                message.textContent = "OTP sent. Redirecting...";
                message.className = "message success";
                setTimeout(() => window.location.href = "verify-otp.html", 700);
            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";
            }
        });
    </script>
</body>
</html>
