<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Fitness Performance Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../demo/auth.css">
    <script src="../js/config.js"></script>

    <style>
        .auth {
            --img: url("../demo/student.jpg");
            --hx: 5.6cqw;
            --hy: 11.5cqw;
            --hfont: Montserrat, Inter, Poppins, sans-serif;
            --hw: 800;
            --hs: 4.7;
            --hl: .93;
            --hls: -.03em;
            --bw: 4.6;
            --bt: 2.3cqw;
            --barbg: linear-gradient(90deg, #fff, #2d8cff);
            --pt: 2.5cqw;
            --pw: 26;
            --ps: 1.3;
            --pl: 1.45;
        }

        .error-message {
            display: none;
            width: calc(var(--u) * 33.3);
            margin-bottom: calc(var(--u) * 1.3);
            padding: calc(var(--u) * 1.1);
            border: 1px solid #fecdd3;
            border-radius: calc(var(--u) * .7);
            background: #fff1f2;
            color: #be123c;
            font-size: calc(var(--u) * 1.05);
            line-height: 1.4;
        }

        .error-message.success {
            border-color: #bbf7d0;
            background: #ecfdf3;
            color: #166534;
        }

        .panel form {
            width: 100%;
        }

        #forgotPasswordForm .btn {
            margin-top: calc(var(--u) * 1.2);
        }

        @media (max-width: 860px) {
            .error-message {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="auth">
        <section class="art">
            <div class="copy">
                <h2>Track.<br>Improve.<br><span class="accent">Perform.</span></h2>
                <div class="bar"></div>
                <p>
                    Stay connected with your fitness journey, monitor your goals,
                    understand your improvement areas, and receive feedback from your coach.
                </p>
            </div>
        </section>

        <section class="panel">
            <h1>Forgot <span>Password</span></h1>
            <p class="sub">
                Enter your registered email address to receive a verification code.
            </p>

            <div
                class="error-message"
                id="message"
                role="status"
                aria-live="polite"
            ></div>

            <form id="forgotPasswordForm" novalidate>
                <label class="lbl" for="email">Email Address</label>
                <div class="field">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <button class="btn" type="submit" id="sendButton">
                    <span id="buttonText">Continue</span>
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.4"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M4 12h16M14 6l6 6-6 6"></path>
                    </svg>
                </button>
            </form>

            <a class="back" href="javascript:history.back()">← Back to login</a>
        </section>
    </main>

    <script>
        "use strict";

        const API_URL = window.FITNESS_API_BASE || "";
        const form = document.getElementById("forgotPasswordForm");
        const emailInput = document.getElementById("email");
        const sendButton = document.getElementById("sendButton");
        const buttonText = document.getElementById("buttonText");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "error-message" + (type ? " " + type : "");
            message.style.display = "block";
        }

        function clearMessage() {
            message.textContent = "";
            message.className = "error-message";
            message.style.display = "none";
        }

        form.addEventListener("submit", async function (event) {
            event.preventDefault();
            clearMessage();

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showMessage("Please enter your email address.", "error");
                emailInput.focus();
                return;
            }

            if (!emailInput.validity.valid) {
                showMessage("Please enter a valid email address.", "error");
                emailInput.focus();
                return;
            }

            sendButton.disabled = true;
            buttonText.textContent = "Sending...";

            try {
                const response = await fetch(API_URL + "/api/forgot-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json().catch(function () {
                    return {};
                });

                if (!response.ok || !result.success) {
                    throw new Error(
                        result.message || "Unable to send the verification code."
                    );
                }

                sessionStorage.setItem("resetEmail", email);
                showMessage("Verification code sent. Redirecting...", "success");

                window.setTimeout(function () {
                    window.location.href = "verify-otp.html";
                }, 700);
            } catch (error) {
                showMessage(
                    error.message || "Unable to send the verification code. Please try again.",
                    "error"
                );

                sendButton.disabled = false;
                buttonText.textContent = "Continue";
            }
        });
    </script>
</body>
</html>
