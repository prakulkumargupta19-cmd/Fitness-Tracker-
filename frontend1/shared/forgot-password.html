<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | Fitness Performance Tracker</title>
    <link rel="stylesheet" href="../css/student/shared-forgot.css">

    <link rel="stylesheet" href="../css/student/student-signup-verify.css">
    <link rel="stylesheet" href="../css/common/verification-portal.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">

    <script src="../js/config.js"></script>

    <link rel="stylesheet" href="../css/common/app-theme.css">
    <link rel="stylesheet" href="../demo/auth.css">
    <link rel="stylesheet" href="../css/student/student-portal.css?v=8">

    <link rel="stylesheet" href="../css/shared/forgot-password-style-1.css" />
</head>

<body data-portal-role="student">

    <main class="auth">
        <section class="art">
            <div class="copy">
                <h2>Track.<br>Improve.<br><span class="accent">Perform.</span></h2>
                <div class="bar"></div>
                <p>
                    Stay connected with your fitness journey, monitor your goals,
                    understand your improvement areas, and receive feedback from your coach.
                </p>
            </div>
        </section>

        <section class="panel otp-panel forgot-panel">
            <h1>Forgot <span>Password</span></h1>

            <p class="description">
                Enter your registered email address to receive an OTP.
            </p>

            <form id="forgotPasswordForm" novalidate>
                <div class="email-group">
                    <label class="lbl" for="email">Email Address</label>
                    <div class="field">
                        <input
                            class="email-input"
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="verify-button" id="sendButton">
                    Continue
                </button>
            </form>

            <div id="message" class="message" role="status" aria-live="polite"></div>

            <a href="javascript:history.back()" class="back">
                ← Back to login
            </a>
        </section>
    </main>

    <script src="../js/shared/forgot-password-script-1.js"></script>
</body>
</html>
