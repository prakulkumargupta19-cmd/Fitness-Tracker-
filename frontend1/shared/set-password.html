<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Fitness Performance Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/shared-forgot.css">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
</head>
<body>
    <div class="card">
        <h1>Set <span>New Password</span></h1>
        <div class="group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="Enter new password" required>
        </div>
        <div class="group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
        </div>
        <button id="resetButton">Reset Password</button>
        <div id="message" class="message"></div>
    </div>
    <script>
        const API_URL = window.FITNESS_API_BASE || "";
        document.getElementById("resetButton").addEventListener("click", async () => {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const email = sessionStorage.getItem("resetEmail");
            const message = document.getElementById("message");
            if (password !== confirmPassword) {
                message.textContent = "Passwords do not match.";
                message.className = "message error";
                return;
            }
            try {
                const response = await fetch(API_URL + "/api/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, password, stage: "reset" })
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || "Unable to reset password.");
                
                message.textContent = "Password reset successfully. Redirecting...";
                message.className = "message success";
                setTimeout(() => {
                    const role = result.role; // Assuming backend returns role
                    const redirectUrl = role === "admin" ? "../admin/admin-login.html" : role === "coach" ? "../coach/coach-login.html" : "../student/student-login.html";
                    window.location.href = redirectUrl;
                }, 1000);
            } catch (error) {
                message.textContent = error.message;
                message.className = "message error";
            }
        });
    </script>
</body>
</html>
