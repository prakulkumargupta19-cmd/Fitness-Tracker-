<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Sign Up | Fitness Performance Tracker</title>

    <link
        rel="stylesheet"
        href="../css/student/student-signup.css?v=3"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
    <link rel="stylesheet" href="../demo/auth.css">
    <link rel="stylesheet" href="../css/student/student-portal.css?v=8">
</head>

<body data-portal-role="student">

<main class="auth">
    <section class="art">
        <div class="copy">
            <h2>Track.<br>Improve.<br><span class="accent">Perform.</span></h2>
            <div class="bar"></div>
            <p>Stay connected with your fitness journey, monitor your goals, understand your improvement areas, and receive feedback from your coach.</p>
        </div>
    </section>


    <!-- =====================================================
         SIGNUP SECTION
    ====================================================== -->

    <section class="panel student-signup-panel">

        <div class="signup-card">

            <div class="signup-header">

                <h2><span class="text-brand">Student</span> Sign Up</h2>

            </div>


            <!-- ERROR MESSAGE -->

            <div
                id="errorMessage"
                class="message error hidden"
            ></div>


            <!-- SUCCESS MESSAGE -->

            <div
                id="successMessage"
                class="message success hidden"
            ></div>


            <!-- =================================================
                 SIGNUP FORM
            ================================================== -->

            <form
                id="signupForm"
                novalidate
            >

                <!-- FULL NAME -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="studentEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="studentEmail"
                        name="studentEmail"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- MOBILE NUMBER -->

                <div class="form-group">

                    <label for="mobileNumber">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="Enter your mobile number"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- EMERGENCY CONTACT -->

                <div class="form-group">

                    <label for="emergencyContact">
                        Emergency Contact Number
                    </label>

                    <input
                        type="tel"
                        id="emergencyContact"
                        name="emergencyContact"
                        placeholder="Enter emergency contact number"
                        autocomplete="tel"
                        inputmode="numeric"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <!-- SAME STYLE AS STUDENT LOGIN -->

                        <button
                            type="button"
                            class="show-password"
                            id="passwordToggle"
                            aria-label="Show password"
                        >

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <!-- SAME STYLE AS STUDENT LOGIN -->

                        <button
                            type="button"
                            class="show-password"
                            id="confirmPasswordToggle"
                            aria-label="Show password"
                        >

                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                width="20"
                                height="20"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                ></path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                ></circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- TERMS -->

                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="terms"
                            name="terms"
                        >

                        <span>
                            I agree to the Terms & Privacy Policy.
                        </span>

                    </label>

                </div>


                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="signup-button"
                    id="signupButton"
                >

                    <span id="buttonText">
                        Create Account
                    </span>

                </button>

            </form>


            <!-- LOGIN LINK -->

            <div class="login-section">

                Already have an account?

                <a
                    href="student-login.html"
                    class="login-link"
                >
                    Login
                </a>

            </div>


            <!-- BACK LINK -->

            <a
                href="../mainlading.html"
                class="back-link"
            >
                ← Back to role selection
            </a>


            <!-- SECURITY MESSAGE -->

            <div class="security-note">

                <span>
                    Your personal performance data
                    is securely protected.
                </span>

            </div>

        </div>

    </section>

</main>


<!-- =========================================================
     API CLIENT
========================================================== -->

<script src="../js/api-client.js"></script>


<!-- =========================================================
     STUDENT SIGNUP JAVASCRIPT
========================================================== -->

<script>

(function () {

    "use strict";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const signupForm =
        document.getElementById("signupForm");

    const fullNameInput =
        document.getElementById("fullName");

    const emailInput =
        document.getElementById("studentEmail");

    const mobileNumberInput =
        document.getElementById("mobileNumber");

    const emergencyContactInput =
        document.getElementById("emergencyContact");

    const passwordInput =
        document.getElementById("password");

    const confirmPasswordInput =
        document.getElementById("confirmPassword");

    const termsInput =
        document.getElementById("terms");

    const signupButton =
        document.getElementById("signupButton");

    const buttonText =
        document.getElementById("buttonText");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");


    /* =====================================================
       MESSAGE FUNCTIONS
    ===================================================== */

    function showError(message) {

        if (successMessage) {

            successMessage.classList.add("hidden");

            successMessage.textContent = "";

        }

        if (errorMessage) {

            errorMessage.textContent = message;

            errorMessage.classList.remove("hidden");

        }

    }


    function showSuccess(message) {

        if (errorMessage) {

            errorMessage.classList.add("hidden");

            errorMessage.textContent = "";

        }

        if (successMessage) {

            successMessage.textContent = message;

            successMessage.classList.remove("hidden");

        }

    }


    function clearMessages() {

        if (errorMessage) {

            errorMessage.classList.add("hidden");

            errorMessage.textContent = "";

        }

        if (successMessage) {

            successMessage.classList.add("hidden");

            successMessage.textContent = "";

        }

    }


    /* =====================================================
       PASSWORD VISIBILITY
       SAME STYLE AS STUDENT LOGIN PAGE
    ===================================================== */

    function setupPasswordToggle(input, button) {

        if (!input || !button) {
            return;
        }


        button.addEventListener(
            "click",
            function () {

                const isPassword =
                    input.type === "password";


                if (isPassword) {

                    input.type = "text";


                    button.innerHTML = `

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                            ></path>

                            <line
                                x1="1"
                                y1="1"
                                x2="23"
                                y2="23"
                            ></line>

                        </svg>

                    `;


                    button.setAttribute(
                        "aria-label",
                        "Hide password"
                    );


                } else {

                    input.type = "password";


                    button.innerHTML = `

                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                            ></path>

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            ></circle>

                        </svg>

                    `;


                    button.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );

    }


    setupPasswordToggle(
        passwordInput,
        document.getElementById("passwordToggle")
    );


    setupPasswordToggle(
        confirmPasswordInput,
        document.getElementById("confirmPasswordToggle")
    );


    /* =====================================================
       SIGNUP
    ===================================================== */

    signupForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            clearMessages();


            const fullName =
                fullNameInput.value.trim();

            const email =
                emailInput.value
                    .trim()
                    .toLowerCase();

            const mobileNumber =
                mobileNumberInput.value.trim();

            const emergencyContact =
                emergencyContactInput.value.trim();


            /*
             * Never trim passwords.
             */

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;

            const termsAccepted =
                termsInput.checked;


            /* =================================================
               VALIDATION
            ================================================= */

            if (!fullName) {

                showError(
                    "Please enter your full name."
                );

                fullNameInput.focus();

                return;
            }


            if (!email) {

                showError(
                    "Please enter your email address."
                );

                emailInput.focus();

                return;
            }


            if (
                !email.includes("@") ||
                !email.includes(".")
            ) {

                showError(
                    "Please enter a valid email address."
                );

                emailInput.focus();

                return;
            }


            if (!/^\d{10}$/.test(mobileNumber)) {

                showError(
                    "Please enter a valid 10-digit mobile number."
                );

                mobileNumberInput.focus();

                return;
            }


            if (!/^\d{10}$/.test(emergencyContact)) {

                showError(
                    "Please enter a valid 10-digit emergency contact number."
                );

                emergencyContactInput.focus();

                return;
            }


            if (!password) {

                showError(
                    "Please enter a password."
                );

                passwordInput.focus();

                return;
            }


            if (!confirmPassword) {

                showError(
                    "Please confirm your password."
                );

                confirmPasswordInput.focus();

                return;
            }


            if (password.length < 8) {

                showError(
                    "Password must contain at least 8 characters."
                );

                passwordInput.focus();

                return;
            }


            if (password !== confirmPassword) {

                showError(
                    "Passwords do not match."
                );

                confirmPasswordInput.focus();

                return;
            }


            if (!termsAccepted) {

                showError(
                    "Please accept the Terms & Privacy Policy."
                );

                termsInput.focus();

                return;
            }


            /* =================================================
               DISABLE BUTTON
            ================================================= */

            signupButton.disabled = true;

            buttonText.textContent =
                "Creating Account...";


            try {

                /* =================================================
                   REAL BACKEND REQUEST
                ================================================= */

                const response =
                    await API.register({

                        name: fullName,

                        email: email,

                        password: password,

                        contact_number: mobileNumber,

                        confirm_password:
                            confirmPassword,

                        role: "student"

                    });


                console.log(
                    "STUDENT SIGNUP RESPONSE:",
                    response.status,
                    response.data
                );


                /* =================================================
                   SERVER ERROR
                ================================================= */

                if (
                    !response.ok ||
                    !response.data ||
                    response.data.success !== true
                ) {

                    showError(

                        response.data &&
                        response.data.message

                            ? response.data.message

                            : "Unable to create account. Please try again."

                    );

                    return;
                }


                /* =================================================
                   TEMPORARY SIGNUP DATA
                ================================================= */

                sessionStorage.setItem(
                    "signupEmail",
                    email
                );

                sessionStorage.setItem(
                    "signupName",
                    fullName
                );

                sessionStorage.setItem(
                    "signupMobileNumber",
                    mobileNumber
                );

                sessionStorage.setItem(
                    "signupEmergencyContact",
                    emergencyContact
                );


                /* =================================================
                   SUCCESS MESSAGE
                ================================================= */

                showSuccess(

                    response.data.message ||
                    "OTP sent to your email."

                );


                /* =================================================
                   REDIRECT
                ================================================= */

                setTimeout(
                    function () {

                        window.location.href =
                            "student-signup-verify.html";

                    },
                    500
                );

            }


            catch (error) {

                console.error(
                    "STUDENT SIGNUP ERROR:",
                    error
                );

                showError(
                    "Unable to connect to the server. Please try again."
                );

            }


            finally {

                signupButton.disabled = false;

                buttonText.textContent =
                    "Create Account";

            }

        }
    );

})();

</script>

</body>
</html>
