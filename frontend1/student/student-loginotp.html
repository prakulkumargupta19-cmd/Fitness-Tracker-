<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login OTP</title>
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/verification-portal.css">
    <link rel="stylesheet" href="../css/app-theme.css">
</head>
<body>
    <div class="otp-card">
        <div class="otp-icon" aria-hidden="true"><i>✓</i></div>

        <h1>Verify <span>Login</span></h1>

        <p class="description">
            Enter the 6-digit verification code sent to your student email address.
        </p>

        <div class="email-display" id="emailDisplay"></div>

        <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" autofocus aria-label="Digit 1">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" aria-label="Digit 2">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" aria-label="Digit 3">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" aria-label="Digit 4">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" aria-label="Digit 5">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" aria-label="Digit 6">
        </div>

        <button type="button" class="verify-button" id="verifyButton">Verify OTP</button>

        <div class="timer">
            OTP expires in: <span id="timer">02:00</span>
        </div>

        <div class="resend">
            Didn't receive the code?
            <button type="button" id="resendButton" disabled>Resend OTP</button>
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <a href="student-login.html" class="back-link">Back to login</a>
    </div>

    <script>
        (function () {
            const API_BASE = window.FITNESS_API_BASE || "";
            const email = (sessionStorage.getItem("loginOtpEmail") || "").trim().toLowerCase();
            const otpInputs = document.querySelectorAll(".otp-input");
            const verifyButton = document.getElementById("verifyButton");
            const resendButton = document.getElementById("resendButton");
            const message = document.getElementById("message");
            const timerElement = document.getElementById("timer");

            document.getElementById("emailDisplay").textContent = email
                ? "Code sent to " + email
                : "Login session expired.";

            function showMessage(text, type) {
                message.textContent = text;
                message.className = "message " + type;
            }

            function getOtp() {
                return Array.from(otpInputs).map(function (input) {
                    return input.value;
                }).join("");
            }

            otpInputs.forEach(function (input, index) {
                input.addEventListener("input", function () {
                    input.value = input.value.replace(/\D/g, "").slice(0, 1);
                    if (input.value && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });

                input.addEventListener("keydown", function (event) {
                    if (event.key === "Backspace" && !input.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                    if (event.key === "ArrowLeft" && index > 0) otpInputs[index - 1].focus();
                    if (event.key === "ArrowRight" && index < otpInputs.length - 1) otpInputs[index + 1].focus();
                });

                input.addEventListener("paste", function (event) {
                    event.preventDefault();
                    const pasted = event.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
                    pasted.split("").forEach(function (digit, digitIndex) {
                        if (otpInputs[digitIndex]) otpInputs[digitIndex].value = digit;
                    });
                    if (pasted) otpInputs[Math.min(pasted.length - 1, 5)].focus();
                });
            });

            let timeLeft = 120;
            let countdown;

            function updateTimer() {
                timerElement.textContent = String(Math.floor(timeLeft / 60)).padStart(2, "0") + ":" + String(timeLeft % 60).padStart(2, "0");
            }

            function startTimer() {
                clearInterval(countdown);
                timeLeft = 120;
                resendButton.disabled = true;
                updateTimer();
                countdown = setInterval(function () {
                    timeLeft--;
                    updateTimer();
                    if (timeLeft <= 0) {
                        clearInterval(countdown);
                        timerElement.textContent = "Expired";
                        resendButton.disabled = false;
                    }
                }, 1000);
            }

            if (!email) {
                verifyButton.disabled = true;
                resendButton.disabled = true;
                showMessage("Please start the login process again.", "error");
            } else {
                startTimer();
                otpInputs[0].focus();
            }

            verifyButton.addEventListener("click", async function () {
                const otp = getOtp();
                if (!/^\d{6}$/.test(otp)) {
                    showMessage("Enter the complete 6-digit OTP.", "error");
                    return;
                }
                if (timeLeft <= 0) {
                    showMessage("This OTP has expired. Request a new one.", "error");
                    return;
                }

                verifyButton.disabled = true;
                verifyButton.textContent = "Verifying...";
                try {
                    const response = await fetch(`${API_BASE}/api/login/verify-otp`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({ email: email, otp: otp })
                    });
                    const data = await response.json().catch(function () { return {}; });
                    if (!response.ok || !data.success) throw new Error(data.message || "Invalid or expired OTP.");
                    clearInterval(countdown);
                    sessionStorage.removeItem("loginOtpEmail");
                    showMessage("Login verified. Opening dashboard...", "success");
                    verifyButton.textContent = "OTP Verified";
                    setTimeout(function () { window.location.replace("student-dashboard.html"); }, 700);
                } catch (error) {
                    showMessage(error.message, "error");
                    verifyButton.disabled = false;
                    verifyButton.textContent = "Verify OTP";
                }
            });

            resendButton.addEventListener("click", async function () {
                resendButton.disabled = true;
                resendButton.textContent = "Sending...";
                try {
                    const response = await fetch(`${API_BASE}/api/login/resend-otp`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({ email: email })
                    });
                    const data = await response.json().catch(function () { return {}; });
                    if (!response.ok || !data.success) throw new Error(data.message || "Unable to resend OTP.");
                    otpInputs.forEach(function (input) { input.value = ""; });
                    startTimer();
                    showMessage(data.message || "A new OTP has been sent.", "success");
                } catch (error) {
                    showMessage(error.message, "error");
                    resendButton.disabled = false;
                }
                resendButton.textContent = "Resend OTP";
            });
        }());
    </script>
</body>
</html>
