<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP | Fitness Performance Tracker</title>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;

            background:
                linear-gradient(
                    rgba(5, 15, 25, 0.80),
                    rgba(5, 15, 25, 0.90)
                ),
                url("https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=2000&q=85")
                center center / cover no-repeat;
        }

        /* =========================================================
           CARD
        ========================================================= */

        .otp-card {
            width: 100%;
            max-width: 505px;
            background: #ffffff;
            border-radius: 20px;
            padding: 42px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* =========================================================
           ICON
        ========================================================= */

        .otp-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #ecfdf3;
            border: 2px solid #62bbe8;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        /* =========================================================
           HEADING
        ========================================================= */

        h1 {
            font-size: 31px;
            color: #111111;
            margin-bottom: 10px;
        }

        h1 span {
            color: #62bbe8;
        }

        .description {
            color: #666666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* =========================================================
           EMAIL DISPLAY
        ========================================================= */

        .email-display {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #555555;
        }

        .email-display strong {
            color: #222222;
        }

        /* =========================================================
           OTP BOXES
        ========================================================= */

        .otp-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 23px;
        }

        .otp-input {
            width: 50px;
            height: 57px;

            border: 1px solid #d5d5d5;
            border-radius: 9px;

            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #111111;

            outline: none;
            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .otp-input:focus {
            border-color: #62bbe8;
            box-shadow: 0 0 0 3px rgba(98, 187, 232, 0.15);
        }

        /* =========================================================
           VERIFY BUTTON
        ========================================================= */

        .verify-button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #62bbe8;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .verify-button:hover:not(:disabled) {
            background: #55afe0;
            transform: translateY(-1px);
        }

        .verify-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================================
           TIMER & RESEND
        ========================================================= */

        .timer {
            margin-top: 18px;
            color: #777777;
            font-size: 13px;
        }

        .timer span {
            color: #62bbe8;
            font-weight: bold;
        }

        .resend {
            margin-top: 15px;
            font-size: 13px;
            color: #777777;
        }

        .resend button {
            border: none;
            background: none;
            color: #62bbe8;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .resend button:disabled {
            color: #999999;
            cursor: not-allowed;
        }

        .resend button:hover:not(:disabled) {
            text-decoration: underline;
        }

        /* =========================================================
           MESSAGE
        ========================================================= */

        .message {
            display: none;
            margin-top: 18px;
            padding: 11px;
            border-radius: 7px;
            font-size: 13px;
            line-height: 1.4;
        }

        .message.success {
            display: block;
            background: #ecfdf3;
            color: #1683b8;
            border: 1px solid #b7e2f5;
        }

        .message.error {
            display: block;
            background: #fff1f2;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        /* =========================================================
           CHANGE EMAIL & SECURITY
        ========================================================= */

        .change-email {
            display: inline-block;
            margin-top: 22px;
            color: #555555;
            font-size: 13px;
            text-decoration: none;
        }

        .change-email:hover {
            color: #62bbe8;
        }

        .security-note {
            border-top: 1px solid #eeeeee;
            margin-top: 25px;
            padding-top: 18px;
            color: #888888;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }

            .otp-card {
                padding: 30px 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 27px;
            }

            .otp-container {
                gap: 6px;
            }

            .otp-input {
                width: 43px;
                height: 52px;
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="otp-card">

        <div class="otp-icon">🔐</div>

        <h1>Verify <span>OTP</span></h1>

        <p class="description">
            Enter the 6-digit verification code sent to your registered email address.
        </p>

        <div class="email-display">
            OTP sent to: <strong id="userEmail">Loading...</strong>
        </div>

        <div class="otp-container">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric" autocomplete="one-time-code" autofocus>
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
            <input type="text" class="otp-input" maxlength="1" inputmode="numeric">
        </div>

        <button type="button" class="verify-button" id="verifyButton">
            Verify OTP
        </button>

        <div class="timer">
            OTP expires in: <span id="timer">02:00</span>
        </div>

        <div class="resend">
            Didn't receive the code?
            <button type="button" id="resendButton" disabled>Resend OTP</button>
        </div>

        <div id="message" class="message"></div>

        <a href="forgot-password.html" class="change-email">
            ← Change Email Address
        </a>

        <div class="security-note">
            🔒 Never share your OTP with anyone. Our team will never ask you for your OTP.
        </div>

    </div>

    <script>
        const API_BASE =
            window.location.port === "5000"
                ? ""
                : `http://${window.location.hostname}:5000`;

        const otpInputs = document.querySelectorAll(".otp-input");
        const verifyButton = document.getElementById("verifyButton");
        const resendButton = document.getElementById("resendButton");
        const message = document.getElementById("message");
        const timerElement = document.getElementById("timer");
        const userEmail = document.getElementById("userEmail");

        const resetEmail = sessionStorage.getItem("resetEmail");

        sessionStorage.removeItem("otpVerified");
        sessionStorage.removeItem("resetOtp");

        if (!resetEmail) {
            userEmail.textContent = "No email found";
            verifyButton.disabled = true;
            showMessage(
                "Please start the password reset process again.",
                "error"
            );
        } else {
            userEmail.textContent = maskEmail(resetEmail);
        }

        function maskEmail(email) {
            const parts = email.split("@");
            if (parts.length !== 2) return email;

            const username = parts[0];
            const domain = parts[1];

            if (username.length <= 2) {
                return "*".repeat(username.length) + "@" + domain;
            }

            return (
                username.charAt(0) +
                "*".repeat(username.length - 2) +
                username.charAt(username.length - 1) +
                "@" +
                domain
            );
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        function getOTP() {
            return Array.from(otpInputs).map(input => input.value).join("");
        }

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", function () {
                this.value = this.value.replace(/\D/g, "").slice(0, 1);
                if (this.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener("keydown", function (event) {
                if (event.key === "Backspace" && !this.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
                if (event.key === "ArrowLeft" && index > 0) {
                    otpInputs[index - 1].focus();
                }
                if (event.key === "ArrowRight" && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });

            input.addEventListener("paste", function (event) {
                event.preventDefault();
                const pastedData = event.clipboardData
                    .getData("text")
                    .replace(/\D/g, "")
                    .slice(0, 6);

                pastedData.split("").forEach((digit, i) => {
                    if (otpInputs[i]) otpInputs[i].value = digit;
                });

                if (pastedData.length > 0) {
                    otpInputs[Math.min(pastedData.length - 1, 5)].focus();
                }
            });
        });

        let timeLeft = 120;
        let countdown = null;

        function startTimer() {
            clearInterval(countdown);
            timeLeft = 120;
            resendButton.disabled = true;
            updateTimer();

            countdown = setInterval(() => {
                timeLeft--;
                updateTimer();

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerElement.textContent = "Expired";
                    resendButton.disabled = false;
                }
            }, 1000);
        }

        function updateTimer() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent =
                String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
        }

        verifyButton.addEventListener("click", async function () {
            const otp = getOTP();

            if (!resetEmail) {
                showMessage("No reset email found. Please start over.", "error");
                return;
            }

            if (otp.length !== 6) {
                showMessage("Please enter the complete 6-digit OTP.", "error");
                return;
            }

            if (timeLeft <= 0) {
                showMessage("This OTP has expired. Request a new one.", "error");
                return;
            }

            verifyButton.disabled = true;
            verifyButton.textContent = "Verifying...";
            message.className = "message";

            try {
                const response = await fetch(`${API_BASE}/api/forgot-password/verify-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email: resetEmail, otp: otp })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.message || "Invalid or expired OTP.");
                }

                sessionStorage.setItem("resetEmail", resetEmail);
                sessionStorage.setItem("resetOtp", otp);
                sessionStorage.setItem("otpVerified", "true");

                clearInterval(countdown);
                showMessage(data.message || "OTP verified successfully.", "success");
                verifyButton.textContent = "OTP Verified";

                setTimeout(() => {
                    window.location.replace("reset-password.html");
                }, 700);

            } catch (error) {
                console.error("OTP verification error:", error);
                showMessage(error.message || "Unable to verify OTP.", "error");
                verifyButton.disabled = false;
                verifyButton.textContent = "Verify OTP";
            }
        });

        resendButton.addEventListener("click", async function () {
            if (!resetEmail) return;

            resendButton.disabled = true;
            resendButton.textContent = "Sending...";

            try {
                const response = await fetch(`${API_BASE}/api/forgot-password/resend-otp`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email: resetEmail })
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.message || "Unable to resend OTP.");
                }

                sessionStorage.removeItem("resetOtp");
                sessionStorage.removeItem("otpVerified");

                otpInputs.forEach(input => input.value = "");
                otpInputs[0].focus();
                startTimer();

                showMessage(data.message || "A new OTP has been sent.", "success");

            } catch (error) {
                console.error("Resend OTP error:", error);
                showMessage(error.message || "Unable to resend OTP.", "error");
                resendButton.disabled = false;
            }

            resendButton.textContent = "Resend OTP";
        });

        if (resetEmail) {
            startTimer();
            otpInputs[0].focus();
        }
    </script>

    <script src="../js/auth-flow.js"></script>

</body>

</html>
