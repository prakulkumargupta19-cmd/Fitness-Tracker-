<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Personal Information | Fitness Performance Tracker</title>

    <link
        rel="stylesheet"
        href="../css/student-personalinfo.css"
    >

    <style>
        .profile-form { width: min(33.3cqw, 100%); }
        .progress-text { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
        .progress-text span:nth-child(2) { text-align: center; }
        .progress-text span:last-child { text-align: right; }
        .input-with-unit { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 8px; }
        .unit-select { min-height: 48px; }
        .profile-form textarea { resize: none; }
        .sports-group { margin-bottom: 24px; }
        .sports-label { display: block; margin-bottom: 8px; font-weight: 700; }
        .sports-hint { margin: 0 0 12px; color: var(--muted); font-size: .85rem; }
        .sports-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .sport-option { position: relative; }
        .sport-option input { position: absolute; width: 1px; height: 1px; opacity: 0; }
        .sport-option label { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--field); cursor: pointer; font-size: .9rem; font-weight: 600; }
        .sport-check { width: 20px; height: 20px; border: 2px solid #cbd5e1; border-radius: 5px; }
        .sport-option input:checked + label { border-color: #087cff; background: #eef6ff; color: #0564d6; }
        .sport-option input:checked + label .sport-check { border-color: #087cff; background: #087cff; box-shadow: inset 0 0 0 4px #eef6ff; }
        .button-container { display: flex; justify-content: space-between; align-items: center; gap: .75rem; margin-top: 10px; }
        .next-button { margin-left: auto; }
        .profile-message { margin: 0 0 12px; color: #be123c; font-size: .9rem; }
        @media (max-width: 860px) { .profile-form { width: 100%; } }
        @media (max-width: 600px) { .sports-options { grid-template-columns: 1fr; } }
        @media (max-width: 480px) { .progress-text { gap: .25rem; font-size: .75rem; } }
    </style>
<script src="../js/config.js"></script>
</head>


<body>

    <div class="form-container">

        <!-- HEADER -->

        <div class="form-header">

            <h1>
                Personal <span>Information</span>
            </h1>

            <p>
                Help us understand your fitness profile and goals.
            </p>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <div class="progress-text">

                <span>
                    Account
                </span>

                <span>
                    Basic Information
                </span>

                <span class="active">
                    Personal Information
                </span>

            </div>

            <div class="progress-bar">

                <div class="progress"></div>

            </div>

        </div>


        <!-- FORM -->

        <form id="personalInfoForm">

            <!-- HEIGHT -->

            <div class="form-group">

                <label for="height">
                    Height <span class="required">*</span>
                </label>

                <div class="input-with-unit">

                    <input
                        type="number"
                        id="height"
                        name="height"
                        placeholder="Enter your height"
                        min="50"
                        max="250"
                        step="0.1"
                        required
                    >

                    <select
                        id="height-unit"
                        name="height_unit"
                        class="unit-select"
                        required
                    >

                        <option value="cm">
                            cm
                        </option>

                        <option value="ft">
                            ft
                        </option>

                    </select>

                </div>

            </div>


            <!-- WEIGHT -->

            <div class="form-group">

                <label for="weight">
                    Weight <span class="required">*</span>
                </label>

                <div class="input-with-unit">

                    <input
                        type="number"
                        id="weight"
                        name="weight"
                        placeholder="Enter your weight"
                        min="20"
                        max="300"
                        step="0.1"
                        required
                    >

                    <select
                        id="weight-unit"
                        name="weight_unit"
                        class="unit-select"
                        required
                    >

                        <option value="kg">
                            kg
                        </option>

                        <option value="lbs">
                            lbs
                        </option>

                    </select>

                </div>

            </div>


            <!-- SPORTS -->

            <div class="sports-group">

                <label class="sports-label">
                    Sports <span class="required">*</span>
                </label>

                <p class="sports-hint">
                    Select one or more sports you participate in.
                </p>

                <div class="sports-options">

                    <!-- CRICKET -->

                    <div class="sport-option">

                        <input
                            type="checkbox"
                            id="cricket"
                            name="sports"
                            value="Cricket"
                        >

                        <label for="cricket">

                            <span class="sport-check"></span>

                            Cricket

                        </label>

                    </div>


                    <!-- FOOTBALL -->

                    <div class="sport-option">

                        <input
                            type="checkbox"
                            id="football"
                            name="sports"
                            value="Football"
                        >

                        <label for="football">

                            <span class="sport-check"></span>

                            Football

                        </label>

                    </div>

                    <div class="sport-option">

                        <input
                            type="checkbox"
                            id="basketball"
                            name="sports"
                            value="Basketball"
                        >

                        <label for="basketball">

                            <span class="sport-check"></span>

                            Basketball

                        </label>

                    </div>


                    <!-- VOLLEYBALL -->

                    <div class="sport-option">

                        <input
                            type="checkbox"
                            id="volleyball"
                            name="sports"
                            value="Volleyball"
                        >

                        <label for="volleyball">

                            <span class="sport-check"></span>

                            Volleyball

                        </label>

                    </div>


                    <!-- KICKBOXING -->

                    <div class="sport-option">

                        <input
                            type="checkbox"
                            id="kickboxing"
                            name="sports"
                            value="Kickboxing"
                        >

                        <label for="kickboxing">

                            <span class="sport-check"></span>

                            Kickboxing

                        </label>

                    </div>

                    <div class="sport-option">
                        <input type="checkbox" id="badminton" name="sports" value="Badminton">
                        <label for="badminton"><span class="sport-check"></span>Badminton</label>
                    </div>

                    <div class="sport-option">
                        <input type="checkbox" id="athletics" name="sports" value="Athletics">
                        <label for="athletics"><span class="sport-check"></span>Athletics</label>
                    </div>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="button-container">

                <a
                    href="student-basicinfo.html"
                    class="back-button"
                >
                    ← Back
                </a>

                <button
                    type="submit"
                    class="next-button"
                >
                    Continue →
                </button>

            </div>

        </form>


        <!-- FOOTER -->

        <div class="footer">
            Fitness Performance Tracker
        </div>

    </div>


    <script>

        document
            .getElementById("personalInfoForm")
            .addEventListener("submit", async function (event) {

                event.preventDefault();


                /* =========================================
                   BASIC INFORMATION FROM PAGE 2
                ========================================= */

                const basic =
                    JSON.parse(
                        sessionStorage.getItem(
                            "studentProfileBasic"
                        ) || "{}"
                    );


                /* =========================================
                   HEIGHT
                ========================================= */

                const height =
                    Number(
                        document.getElementById("height").value
                    );


                /* =========================================
                   WEIGHT
                ========================================= */

                const weight =
                    Number(
                        document.getElementById("weight").value
                    );


                /* =========================================
                   CONVERT HEIGHT TO CM
                ========================================= */

                const heightCm =
                    document.getElementById("height-unit").value === "ft"
                        ? height * 30.48
                        : height;


                /* =========================================
                   CONVERT WEIGHT TO KG
                ========================================= */

                const weightKg =
                    document.getElementById("weight-unit").value === "lbs"
                        ? weight * 0.453592
                        : weight;


                /* =========================================
                   GET SELECTED SPORTS
                ========================================= */

                const selectedSports =
                    Array.from(
                        document.querySelectorAll(
                            'input[name="sports"]:checked'
                        )
                    ).map(function (checkbox) {
                        return checkbox.value;
                    });


                /* =========================================
                   SPORTS VALIDATION
                ========================================= */

                if (selectedSports.length === 0) {

                    alert(
                        "Please select at least one sport."
                    );

                    return;
                }


                /* =========================================
                   API BASE URL
                ========================================= */

                const apiBase = window.FITNESS_API_BASE || "";


                try {

                    /* =========================================
                       SAVE COMPLETE PROFILE
                    ========================================= */

                    const response =
                        await fetch(
                            apiBase + "/api/profile/setup",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({

                                    ...basic,

                                    emergency_contact:
                                        sessionStorage.getItem("signupEmergencyContact") || "",

                                    height_cm:
                                        heightCm.toFixed(2),

                                    weight_kg:
                                        weightKg.toFixed(2),
                                    sports: selectedSports,
                                    sport_activity: selectedSports.join(",")

                                })
                            }
                        );


                    /* =========================================
                       SERVER RESPONSE
                    ========================================= */

                    const data =
                        await response
                            .json()
                            .catch(function () {
                                return {};
                            });


                    /* =========================================
                       ERROR HANDLING
                    ========================================= */

                    if (
                        !response.ok ||
                        !data.success
                    ) {

                        alert(
                            data.message ||
                            "Unable to save your profile."
                        );

                        return;
                    }


                    /* =========================================
                       PROFILE SAVED SUCCESSFULLY
                    ========================================= */

                    sessionStorage.removeItem(
                        "studentProfileBasic"
                    );

                    sessionStorage.setItem(
                        "student_login_email",
                        sessionStorage.getItem("studentEmail") || ""
                    );

                    sessionStorage.removeItem("signupName");
                    sessionStorage.removeItem("signupMobileNumber");
                    sessionStorage.removeItem("signupEmergencyContact");


                          /* =========================================
                              GO TO STUDENT LOGIN
                          ========================================= */

                    window.location.href =
                                "student-login.html";

                }

                catch (error) {

                    console.error(
                        "PROFILE SETUP ERROR:",
                        error
                    );

                    alert(
                        "Unable to connect to the server. Please try again."
                    );

                }

            });

    </script>

</body>

</html>
