<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Information | Fitness Performance Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    <script src="../js/config.js"></script>
    <link rel="stylesheet" href="../css/common/app-theme.css">
    <link rel="stylesheet" href="../demo/auth.css">
    <link rel="stylesheet" href="../css/student/student-portal.css?v=8">
    <style>
        .profile-form { width: min(33.3cqw, 100%); }
        .progress-text { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
        .progress-text span:nth-child(2) { text-align: center; }
        .progress-text span:last-child { text-align: right; }
        .profile-form .button-container { display: flex; justify-content: space-between; align-items: center; gap: .75rem; }
        .profile-form .next-button { margin-left: auto; }
        .profile-form textarea { resize: none; }
        @media (max-width: 860px) { .profile-form { width: 100%; } }
        @media (max-width: 480px) { .progress-text { gap: .25rem; font-size: .75rem; } }
    </style>
</head>
<body data-portal-role="student">
    <main class="auth">
        <section class="art">
            <div class="copy">
                <h2>Track.<br>Improve.<br><span class="accent">Perform.</span></h2>
                <div class="bar"></div>
                <p>Stay connected with your fitness journey, monitor your goals, understand your improvement areas, and receive feedback from your coach.</p>
            </div>
        </section>

        <section class="panel student-profile-panel">
            <div class="form-container profile-form">
                <div class="form-header">
                    <h1>Basic <span>Information</span></h1>
                    <p>Tell us a little more about yourself to complete your profile.</p>
                </div>

                <div class="progress-container">
                    <div class="progress-text">
                        <span>Account</span>
                        <span class="active">Basic Information</span>
                        <span>Personal Information</span>
                    </div>
                    <div class="progress-bar" role="progressbar" aria-label="Profile setup progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="66">
                        <div class="progress" style="width: 66%;"></div>
                    </div>
                </div>

                <form id="basicInfoForm" novalidate>
                    <div class="form-group">
                        <label for="gender">Gender <span class="required">*</span></label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select your gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer-not-to-say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="semester">Semester <span class="required">*</span></label>
                        <select id="semester" name="semester" required>
                            <option value="" disabled selected>Select your semester</option>
                            <option value="1">Semester 1</option>
                            <option value="2">Semester 2</option>
                            <option value="3">Semester 3</option>
                            <option value="4">Semester 4</option>
                            <option value="5">Semester 5</option>
                            <option value="6">Semester 6</option>
                            <option value="7">Semester 7</option>
                            <option value="8">Semester 8</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="department">Department <span class="required">*</span></label>
                        <select id="department" name="department" required>
                            <option value="" disabled selected>Select your department</option>
                            <option value="BCA">BCA</option>
                            <option value="BBA">BBA</option>
                            <option value="BMS">BMS</option>
                            <option value="HHA">HHA</option>
                            <option value="BBA-HM">BBA-HM</option>
                            <option value="BMAGD">BMAGD</option>
                            <option value="BBA-SM">BBA-SM</option>
                            <option value="BBA-GB">BBA-GB</option>
                            <option value="BBA-E">BBA-E</option>
                            <option value="BID">BID</option>
                            <option value="BFDM">BFDM</option>
                            <option value="BBA-ATA">BBA-ATA</option>
                            <option value="BSC-DA">BSC-DA</option>
                            <option value="BBA-DM">BBA-DM</option>
                            <option value="BITAI">BITAI</option>
                            <option value="BAHSM">BAHSM</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth <span class="required">*</span></label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="blood_group">Blood Group</label>
                        <select id="blood_group" name="blood_group">
                            <option value="" selected>Select</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="medical_history">Medical History / Important Information</label>
                        <textarea id="medical_history" name="medical_history" placeholder="Write None if there is nothing to declare"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="address">Current Address</label>
                        <textarea id="address" name="address" placeholder="Your current residential address"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="parent_name">Parent / Guardian Name</label>
                        <input type="text" id="parent_name" name="parent_name" placeholder="Enter parent/guardian name">
                    </div>

                    <div class="form-group">
                        <label for="parent_phone">Parent / Guardian Phone</label>
                        <input type="text" id="parent_phone" name="parent_phone" placeholder="Enter parent/guardian phone">
                    </div>

                    <div class="form-group">
                        <label for="parent_address">Parent / Guardian Address</label>
                        <textarea id="parent_address" name="parent_address" placeholder="Parent/Guardian's residential address"></textarea>
                    </div>

                    <div class="button-container">
                        <a href="student-signup.html" class="back-button">← Back</a>
                        <button type="submit" class="next-button">Continue →</button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const form = document.getElementById("basicInfoForm");
            const dob = document.getElementById("dob");
            const today = new Date();
            dob.max = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0") + "-" + String(today.getDate()).padStart(2, "0");

            const optionalProfileFields = ["blood_group", "medical_history", "address", "parent_name", "parent_phone", "parent_address"];
            const savedBasicInfo = JSON.parse(sessionStorage.getItem("studentProfileBasic") || "null");
            if (savedBasicInfo) {
                optionalProfileFields.forEach(function (field) {
                    if (savedBasicInfo[field] !== undefined) document.getElementById(field).value = savedBasicInfo[field];
                });
            }

            form.addEventListener("submit", function (event) {
                event.preventDefault();
                if (!form.reportValidity()) return;

                sessionStorage.setItem("studentProfileBasic", JSON.stringify({
                    gender: document.getElementById("gender").value,
                    semester: document.getElementById("semester").value,
                    department: document.getElementById("department").value.trim(),
                    date_of_birth: dob.value,
                    blood_group: document.getElementById("blood_group").value,
                    medical_history: document.getElementById("medical_history").value.trim(),
                    address: document.getElementById("address").value.trim(),
                    parent_name: document.getElementById("parent_name").value.trim(),
                    parent_phone: document.getElementById("parent_phone").value.trim(),
                    parent_address: document.getElementById("parent_address").value.trim()
                }));
                window.location.href = "student-personalinfo.html";
            });
        }());
    </script>
</body>
</html>
