<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basic Information | Fitness Performance Tracker</title>

    <link
        rel="stylesheet"
        href="../css/student-basicinfo.css"
    >
</head>

<body>

    <div class="form-container">

        <!-- HEADER -->

        <div class="form-header">

            <h1>
                Basic <span>Information</span>
            </h1>

            <p>
                Tell us a little more about yourself to complete your profile.
            </p>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <div class="progress-text">

                <span>
                    Account
                </span>

                <span class="active">
                    Basic Information
                </span>

                <span>
                    Personal Information
                </span>

            </div>


            <div class="progress-bar">

                <div class="progress"></div>

            </div>

        </div>


        <!-- FORM -->

        <form id="basicInfoForm" action="student-personalinfo.html" method="get">


            <!-- GENDER -->

            <div class="form-group">

                <label for="gender">
                    Gender <span class="required">*</span>
                </label>

                <select id="gender" name="gender" required>

                    <option value="" disabled selected>
                        Select your gender
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                    <option value="prefer-not-to-say">
                        Prefer not to say
                    </option>

                </select>

            </div>


            <!-- SEMESTER -->

            <div class="form-group">

                <label for="semester">
                    Semester <span class="required">*</span>
                </label>

                <select id="semester" name="semester" required>

                    <option value="" disabled selected>
                        Select your semester
                    </option>

                    <option value="1">
                        Semester 1
                    </option>

                    <option value="2">
                        Semester 2
                    </option>

                    <option value="3">
                        Semester 3
                    </option>

                    <option value="4">
                        Semester 4
                    </option>

                    <option value="5">
                        Semester 5
                    </option>

                    <option value="6">
                        Semester 6
                    </option>

                    <option value="7">
                        Semester 7
                    </option>

                    <option value="8">
                        Semester 8
                    </option>

                </select>

            </div>


            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="department"
                    name="department"
                    placeholder="Enter your department"
                    required
                >

            </div>


            <!-- DATE OF BIRTH -->

            <div class="form-group">

                <label for="dob">
                    Date of Birth <span class="required">*</span>
                </label>

                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required
                >

            </div>


            <!-- BUTTONS -->

            <div class="button-container">

                <a
                    href="student-signup.html"
                    class="back-button"
                >
                    ← Back
                </a>

                <button
                    type="submit"
                    class="next-button"
                >
                    Continue →
                </button>

            </div>


        </form>


        <!-- FOOTER -->

        <div class="footer">
            Fitness Performance Tracker
        </div>


    </div>


    <script>

    document
        .getElementById("basicInfoForm")
        .addEventListener("submit", function () {

            sessionStorage.setItem(
                "studentProfileBasic",
                JSON.stringify({

                    gender:
                        document.getElementById("gender").value,

                    semester:
                        document.getElementById("semester").value,

                    department:
                        document.getElementById("department").value.trim(),

                    date_of_birth:
                        document.getElementById("dob").value

                })
            );

        });

    </script>


</body>

</html>
