<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set New Password | Fitness Performance Tracker</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/student/student-reset-password.css">

    <script src="../js/config.js"></script>
</head>

<body>

    <main class="password-page">

        <div class="password-card">

            <!-- LOCK ICON -->
            <div class="password-icon" aria-hidden="true">
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                        fill="currentColor"
                    />

                    <path
                        d="M8 10V7.5C8 5.57 9.57 4 11.5 4H12.5C14.43 4 16 5.57 16 7.5V10"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <circle
                        cx="12"
                        cy="15"
                        r="1.2"
                        fill="white"
                    />
                </svg>
            </div>


            <!-- HEADING -->

            <h1>
                <span>Set New</span> Password
            </h1>

            <p class="description">
                Create a new password for your account.<br>
                Make sure it's strong and secure.
            </p>


            <!-- NEW PASSWORD -->

            <div class="group">

                <label for="password">
                    New Password
                </label>

                <div class="password-field">

                    <svg
                        class="field-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <path
                            d="M8 10V7.5C8 5.57 9.57 4 11.5 4H12.5C14.43 4 16 5.57 16 7.5V10"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />
                    </svg>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                        aria-label="Show password"
                    >
                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M2.5 12C4.4 7.8 7.7 5.5 12 5.5C16.3 5.5 19.6 7.8 21.5 12C19.6 16.2 16.3 18.5 12 18.5C7.7 18.5 4.4 16.2 2.5 12Z"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />
                        </svg>
                    </button>

                </div>


                <!-- PASSWORD REQUIREMENTS -->

                <div class="requirements">

                    <div class="requirement">
                        <span class="check"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3.5 3.5 7.5-7.5"/></svg></span>
                        At least 8 characters
                    </div>

                    <div class="requirement">
                        <span class="check"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3.5 3.5 7.5-7.5"/></svg></span>
                        Contains a number
                    </div>

                    <div class="requirement">
                        <span class="check"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3.5 3.5 7.5-7.5"/></svg></span>
                        Contains an uppercase letter
                    </div>

                    <div class="requirement">
                        <span class="check"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 8.5l3.5 3.5 7.5-7.5"/></svg></span>
                        Contains a special character (e.g. !@#$)
                    </div>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="group confirm-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-field">

                    <svg
                        class="field-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <rect
                            x="5"
                            y="10"
                            width="14"
                            height="10"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="1.8"
                        />

                        <path
                            d="M8 10V7.5C8 5.57 9.57 4 11.5 4H12.5C14.43 4 16 5.57 16 7.5V10"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />
                    </svg>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Show password"
                    >
                        <svg
                            class="eye-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M2.5 12C4.4 7.8 7.7 5.5 12 5.5C16.3 5.5 19.6 7.8 21.5 12C19.6 16.2 16.3 18.5 12 18.5C7.7 18.5 4.4 16.2 2.5 12Z"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="2.5"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />
                        </svg>
                    </button>

                </div>

            </div>


            <!-- RESET BUTTON -->

            <button
                type="button"
                id="resetButton"
                class="reset-button"
            >
                <span>Reset Password</span>

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                </svg>
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="message"
                aria-live="polite"
            ></div>


            <!-- OR -->

            <div class="divider">
                <span></span>
                <strong>OR</strong>
                <span></span>
            </div>


            <!-- BACK TO LOGIN -->

            <a
                href="../student/student-login.html"
                class="back-link"
            >
                <span>←</span>
                Back to Login
            </a>

        </div>

    </main>


    <script>

        /* =====================================================
           EXISTING BACKEND LOGIC
        ===================================================== */

        const API_URL = window.FITNESS_API_BASE || "";


        document
            .getElementById("resetButton")
            .addEventListener("click", async () => {

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const email =
                    sessionStorage.getItem("resetEmail");

                const resetToken =
                    sessionStorage.getItem("resetToken");

                const message =
                    document.getElementById("message");


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.className =
                        "message error";

                    return;
                }


                try {

                    const response =
                        await fetch(
                            API_URL + "/api/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                credentials: "include",

                                body: JSON.stringify({
                                    email,
                                    password,
                                    reset_token: resetToken,
                                    stage: "reset"
                                })
                            }
                        );


                    const result =
                        await response.json();


                    if (
                        !response.ok ||
                        !result.success
                    ) {

                        throw new Error(
                            result.message ||
                            "Unable to reset password."
                        );

                    }


                    message.textContent =
                        result.role === "coach"
                            ? "Password reset successfully. Redirecting to Coach Login..."
                            : "Password reset successfully. Redirecting to Login...";

                    message.className =
                        "message success";

                    sessionStorage.removeItem("resetToken");
                    sessionStorage.removeItem("resetEmail");


                    setTimeout(() => {

                        const role =
                            result.role;

                        const redirectUrl =
                            role === "admin"
                                ? "../admin/admin-login.html"
                                : role === "coach"
                                    ? "../coach/coach-login.html?reset=success"
                                    : "../student/student-login.html";

                        window.location.href =
                            redirectUrl;

                    }, 1800);


                } catch (error) {

                    message.textContent =
                        error.message;

                    message.className =
                        "message error";

                }

            });


        /* =====================================================
           PASSWORD VISIBILITY
           UI ONLY — DOES NOT CHANGE BACKEND LOGIC
        ===================================================== */

        document
            .querySelectorAll(".toggle-password")
            .forEach(button => {

                button.addEventListener("click", () => {

                    const targetId =
                        button.dataset.target;

                    const input =
                        document.getElementById(targetId);

                    if (input.type === "password") {

                        input.type = "text";

                        button.setAttribute(
                            "aria-label",
                            "Hide password"
                        );

                    } else {

                        input.type = "password";

                        button.setAttribute(
                            "aria-label",
                            "Show password"
                        );

                    }

                });

            });

    </script>

</body>

</html>
